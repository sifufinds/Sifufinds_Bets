name: X (Twitter) Posts — 4x daily rotating content

on:
  schedule:
    # 4x per day: 09:00, 13:00, 17:00, 21:00 UTC (peak WAT/EAT engagement)
    # Rotation: news → offer → tip → offer (auto mode cycles per run)
    - cron: "0 9 * * *"
    - cron: "0 13 * * *"
    - cron: "0 17 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Content type: auto | offer | news | tip"
        required: false
        default: "auto"
      dry_run:
        description: "Preview tweet without posting (true/false)"
        required: false
        default: "false"
      force:
        description: "Ignore brand cooldown (true/false)"
        required: false
        default: "false"

concurrency:
  group: twitter-posts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post-tweet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest (avoid stale blog posts)
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('agents/python/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r agents/python/requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Post to X (Twitter)
        working-directory: agents/python
        env:
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_PASSWORD: ${{ secrets.X_PASSWORD }}
          X_EMAIL: ${{ secrets.X_EMAIL }}
        run: |
          echo "X_USERNAME set: $([ -n "$X_USERNAME" ] && echo YES || echo NO)"
          echo "X_PASSWORD set: $([ -n "$X_PASSWORD" ] && echo YES || echo NO)"
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          ARGS="--mode $MODE"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python agent_twitter_posts.py $ARGS

      - name: Commit updated state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "agents@sifufinds.com"
          git config --local user.name "SifuFinds Agent"
          git add agents/python/twitter_state.json agents/python/agent_log.json || true
          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "twitter: posted $(date -u '+%Y-%m-%d %H:%M') UTC"

          # Retry push up to 5 times — handles concurrent bot pushes
          for _attempt in 1 2 3 4 5; do
            if git push; then
              echo "✅ Pushed on attempt $_attempt"
              break
            fi
            if [ "$_attempt" -eq 5 ]; then
              echo "❌ Push failed after 5 attempts"
              exit 1
            fi
            echo "⚠ Push rejected (attempt $_attempt/5) — rebasing in 5s..."
            sleep 5
            git fetch origin main
            git rebase FETCH_HEAD -X theirs || git rebase --abort
          done
