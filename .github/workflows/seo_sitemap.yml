name: SEO — Update sitemap lastmod after blog publish

on:
  # Trigger whenever the breaking news bot pushes new posts
  push:
    branches: [main]
    paths:
      - "blog/posts.json"
      - "blog/posts-data.js"
      - "blog/ticker.json"
  # Also allow manual trigger
  workflow_dispatch:

concurrency:
  group: seo-sitemap
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update sitemap lastmod dates
        run: |
          TODAY=$(date -u '+%Y-%m-%d')
          # Replace all lastmod dates in sitemap.xml with today's date
          sed -i "s|<lastmod>[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}</lastmod>|<lastmod>${TODAY}</lastmod>|g" sitemap.xml
          echo "Sitemap lastmod updated to ${TODAY}"

      - name: Commit updated sitemap
        run: |
          git config --local user.email "seo@sifufinds.com"
          git config --local user.name "SifuFinds SEO Bot"
          git add sitemap.xml
          if git diff --cached --quiet; then
            echo "No sitemap changes"
            exit 0
          fi
          git commit -m "seo: update sitemap lastmod to $(date -u '+%Y-%m-%d')"

          # Retry push up to 5 times — handles concurrent bot pushes
          for _attempt in 1 2 3 4 5; do
            if git push; then
              echo "✅ Pushed on attempt $_attempt"
              break
            fi
            if [ "$_attempt" -eq 5 ]; then
              echo "❌ Push failed after 5 attempts"
              exit 1
            fi
            echo "⚠ Push rejected (attempt $_attempt/5) — rebasing in 5s..."
            sleep 5
            git fetch origin main
            git rebase FETCH_HEAD -X theirs || git rebase --abort
          done

      # ── Ping search engines so they re-crawl immediately ─────────────
      - name: Ping Google Search Console
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://www.google.com/ping?sitemap=https://sifufinds.com/sitemap.xml")
          echo "Google ping status: $STATUS"

      - name: Ping Bing Webmaster Tools
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://www.bing.com/ping?sitemap=https://sifufinds.com/sitemap.xml")
          echo "Bing ping status: $STATUS"
