name: Brand Bonus Scraper — Daily Update

# Runs daily at 02:00 UTC — first run of the day so Groq/Gemini quotas are fresh.
# (03:00 WAT / 05:00 EAT / 04:00 SAST)
# This agent scrapes all 11 bookmaker banner brands to verify and update:
#   - Welcome bonuses & promo codes
#   - Free bets & free games
#   - Casino offers & best markets
# Writes blog/banners.json, blog/banners-data.js, brands/data.json
# then commits + pushes so GitHub Pages serves the updated data immediately.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      brand:
        description: "Scrape a specific brand (leave blank for all)"
        required: false
        default: ""
      dry_run:
        description: "Dry run — show changes without writing"
        required: false
        default: "false"

concurrency:
  group: brand-scraper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-scraper-${{ hashFiles('agents/python/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-scraper-

      - name: Install dependencies
        run: pip install -r agents/python/requirements.txt

      - name: Run brand bonus scraper
        working-directory: agents/python
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.brand }}" ]; then
            ARGS="--brand '${{ github.event.inputs.brand }}'"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python agent_brand_scraper.py $ARGS

      - name: Commit updated data files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "agents@sifufinds.com"
          git config --local user.name "SifuFinds Scraper"
          git add \
            blog/banners.json \
            blog/banners-data.js \
            brands/data.json \
            agents/python/scraper_state.json \
            agents/python/scraper_changes.json \
            || true
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
            exit 0
          fi
          CHANGED_COUNT=$(git diff --cached --name-only | wc -l | tr -d ' ')
          git commit -m "scraper: update brand bonuses $(date -u '+%Y-%m-%d') — ${CHANGED_COUNT} files changed"

          # Retry push up to 5 times — handles concurrent bot pushes
          for _attempt in 1 2 3 4 5; do
            if git push; then
              echo "✅ Pushed on attempt $_attempt"
              break
            fi
            if [ "$_attempt" -eq 5 ]; then
              echo "❌ Push failed after 5 attempts"
              exit 1
            fi
            echo "⚠ Push rejected (attempt $_attempt/5) — rebasing in 5s..."
            sleep 5
            git fetch origin main
            git rebase FETCH_HEAD -X theirs || git rebase --abort
          done
