name: SEO Doctor — Daily auto-heal sifufinds.com

# Runs every day at 06:00 UTC.
# Checks and auto-fixes every SEO signal: title/meta lengths, dateModified,
# thin content, FAQ coverage, schema freshness, llms.txt, and sitemap.
# Regenerates all blog HTML and sitemap, then deploys if anything changed.
#
# This workflow NEVER exits with failure — it heals, then exits 0.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: seo-doctor
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  seo-heal:
    name: SEO Doctor — check and heal
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests 2>/dev/null || true

      - name: Run indexability guard (auto-fix)
        id: indexability
        shell: bash
        run: |
          set +e
          python3 scripts/check_indexability.py --fix --live --report
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Fix duplicate slugs, thin titles/meta (auto-heal)
        id: seo_check
        shell: bash
        run: |
          set +e
          # dedupe_slugs() runs at the top of gen_blog_post_pages.py's main() —
          # resolve duplicate slugs FIRST so seo_check.py --fix below mutates
          # the correct (unique) post object, not a shadowed duplicate.
          python3 gen_blog_post_pages.py --force
          python3 scripts/seo_check.py --fix --report
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          python3 gen_blog_post_pages.py --force
          python3 gen_sitemap.py
          exit 0

      - name: Refresh "Updated <Month Year>" freshness dates (auto-heal)
        id: freshness_dates
        shell: bash
        run: |
          set +e
          # These generators read the real current month/year via
          # seo_meta.current_month_year()/current_year() (fixed 2026-08-16 —
          # 6 of them had 'June 2026' hardcoded literally, 238 deployed
          # pages stuck showing that date two months on). Re-running them
          # daily is a harmless no-op except on the day the month actually
          # rolls over, when every "Updated <Month Year>" / "Reviewed
          # <Month Year>" stamp and dateModified field advances for free.
          python3 gen_sport_country_pages.py
          python3 gen_payment_country_pages.py
          python3 gen_bookmaker_country_pages.py
          python3 gen_bk_reviews.py
          python3 gen_more_reviews.py
          python3 generate_country_pages.py
          python3 gen_best_betting_pages.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Fix stale "N African countries" copy (auto-heal)
        id: country_count
        shell: bash
        run: |
          set +e
          python3 scripts/check_country_count.py --fix
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run SEO Doctor
        id: doctor
        working-directory: agents/python
        shell: bash
        run: |
          set +e
          python seo_doctor.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit any fixes
        id: commit
        run: |
          git config --local user.email "seo-doctor@sifufinds.com"
          git config --local user.name "SifuFinds SEO Doctor"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No SEO changes needed"
          else
            COUNT=$(git diff --cached --name-only | wc -l | tr -d ' ')
            git commit -m "seo: daily auto-heal $(date -u '+%Y-%m-%d') — ${COUNT} files updated"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push fixes
        if: steps.commit.outputs.changed == 'true'
        run: |
          for attempt in 1 2 3; do
            if git push; then
              echo "✅ Pushed on attempt $attempt"
              break
            fi
            [ "$attempt" -eq 3 ] && { echo "❌ Push failed — will retry next run"; break; }
            echo "⚠ Push rejected ($attempt/3) — rebasing..."
            sleep 5
            git fetch origin main
            git rebase FETCH_HEAD -X theirs || git rebase --abort
          done

      - name: Trigger deploy if fixes applied
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh workflow run deploy_hostinger.yml \
            --repo "${{ github.repository }}" \
            --ref main && echo "✅ Deploy triggered" || echo "⚠️ Deploy trigger failed (will self-correct on next push)"
          exit 0

      - name: Report outcome
        if: always()
        run: |
          IDX_CODE="${{ steps.indexability.outputs.exit_code }}"
          if [ -z "$IDX_CODE" ] || [ "$IDX_CODE" = "0" ]; then
            echo "✅ Indexability guard — nothing is stopping Google from crawling the site"
          else
            echo "🚨 Indexability guard found issues it could NOT auto-fix — see 'Run indexability guard' step above and indexability-report.json"
          fi

          FRESH_CODE="${{ steps.freshness_dates.outputs.exit_code }}"
          if [ -z "$FRESH_CODE" ] || [ "$FRESH_CODE" = "0" ]; then
            echo "✅ Freshness-date guard — all 'Updated/Reviewed <Month Year>' stamps regenerated from today's real date"
          else
            echo "🚨 Freshness-date guard failed to run — see 'Refresh freshness dates' step above"
          fi

          SEO_CODE="${{ steps.seo_check.outputs.exit_code }}"
          if [ -z "$SEO_CODE" ] || [ "$SEO_CODE" = "0" ]; then
            echo "✅ SEO audit — no CRITICAL issues (duplicate slugs, etc.)"
          else
            echo "🚨 SEO audit found CRITICAL issue(s) it could NOT auto-fix — see 'Fix duplicate slugs' step above and seo-report.json"
          fi

          CC_CODE="${{ steps.country_count.outputs.exit_code }}"
          if [ -z "$CC_CODE" ] || [ "$CC_CODE" = "0" ]; then
            echo "✅ Country-count guard — no stale 'N African countries' copy"
          else
            echo "🚨 Country-count guard found issue(s) it could NOT auto-fix (needs a reword, not just a number swap) — see 'Fix stale' step above"
          fi

          CODE="${{ steps.doctor.outputs.exit_code }}"
          if [ -z "$CODE" ] || [ "$CODE" = "0" ]; then
            echo "✅ SEO Doctor completed — site is healthy"
          else
            echo "⚠️ SEO Doctor exit code $CODE — check logs above"
          fi
