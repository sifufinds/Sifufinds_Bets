name: Content Backfill — expand thin/no-FAQ blog posts

# Legacy blog posts written before the current content standard (1,000+ words,
# mandatory FAQ, comparison table) never got backfilled. This works through
# that backlog a small batch at a time, permanently, so it never depends on
# a human or an agent session remembering to do it.
#
# Runs once daily shortly after Groq's midnight UTC token quota resets, ahead
# of the other content bots (agent1_content, agent_sports_blog, breaking_news)
# that consume the same shared Groq/Gemini keys throughout the day.
#
# Progress is tracked in agents/python/content_backfill_state.json — committed
# to the repo, so it survives across runs and sessions. A post that fails
# expansion 3 times is left in place (not reprocessed forever) and stays
# visible there for manual follow-up.
#
# This workflow never exits with a failure code — a quota-exhausted run just
# means 0 posts fixed this time; it tries again on the next scheduled run.

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

concurrency:
  group: content-backfill
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    name: Expand next batch of thin/no-FAQ posts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('agents/python/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r agents/python/requirements.txt

      - name: Run content backfill agent
        id: backfill
        working-directory: agents/python
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          set +e
          python agent_content_backfill.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Regenerate static blog pages
        run: python3 gen_blog_post_pages.py --force

      - name: Regenerate sitemap
        run: python3 gen_sitemap.py

      - name: Commit and push expanded posts
        run: |
          git config --local user.email "content-backfill@sifufinds.com"
          git config --local user.name "SifuFinds Content Backfill"
          git add blog/posts.json blog/ sitemap*.xml agents/python/content_backfill_state.json
          if git diff --cached --quiet; then
            echo "No posts expanded this run — nothing to commit"
            exit 0
          fi
          git commit -m "content: backfill thin/no-FAQ posts $(date -u '+%Y-%m-%d') UTC"

          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "✅ Pushed on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "❌ Push failed after 5 attempts"
              exit 1
            fi
            echo "Push rejected (attempt $attempt/5) — merging posts and retrying..."
            sleep 5
            git fetch origin main
            python3 agents/python/merge_posts.py
            python3 gen_blog_post_pages.py --force
            python3 gen_sitemap.py
            git reset --soft HEAD~1
            git rebase FETCH_HEAD || git rebase --abort
            git add blog/posts.json blog/ sitemap*.xml agents/python/content_backfill_state.json
            git diff --cached --quiet || git commit --amend --no-edit
          done

      - name: Trigger deploy if content changed
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh workflow run deploy_hostinger.yml \
            --repo "${{ github.repository }}" \
            --ref main && echo "✅ Deploy triggered" || echo "⚠️ Deploy trigger failed (will self-correct on next push)"
          exit 0

      - name: Report outcome
        if: always()
        run: |
          CODE="${{ steps.backfill.outputs.exit_code }}"
          if [ -z "$CODE" ] || [ "$CODE" = "0" ]; then
            echo "✅ Content backfill agent ran — see logs above for posts fixed / backlog remaining"
          else
            echo "⚠️ Content backfill agent exit code $CODE — check logs above"
          fi
