name: Leagues — Update match data every 30 minutes

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: update-leagues
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    name: Fetch leagues data from football-data.org
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch matches
        env:
          FD_TOKEN: ${{ secrets.FD_TOKEN }}
        run: python3 update_leagues.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "leaguesbot@sifufinds.com"
          git config --local user.name "LeaguesBot"
          git add data/matches_live.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "leagues: match data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin main
          fi
