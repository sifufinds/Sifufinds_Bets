name: Transfer News Bot — Live coverage every 5 minutes

# GitHub Actions' scheduler does not reliably deliver high-frequency cron
# triggers on an account running this many concurrent scheduled workflows.
# Verified empirically on this repo on 2026-07-27: this workflow's
# "*/5 * * * *" cron was actually firing roughly once per hour (sometimes
# with 3+ hour gaps) — and live_odds.yml (also "*/5 * * * *") and
# hourly_scrape.yml (also "*/15 * * * *") showed the exact same ~hourly
# real-world cadence regardless of their configured interval. That means
# GitHub is dropping the vast majority of scheduled events account-wide, not
# misreading any one workflow's cron expression — editing cron syntax alone
# cannot fix this.
#
# Fix: this job is self-perpetuating instead of relying on GitHub to deliver
# every tick. Once a run actually starts (whenever GitHub gets around to
# firing the trigger below), it loops internally on its own clock — checking
# for fresh transfer news every 5 minutes — for up to ~5h50m, just under
# GitHub-hosted runners' 6-hour hard cap on a single job. The real 5-minute
# cadence comes from that internal loop, not from GitHub's cron delivery.
#
# The hourly schedule below is just a backstop that replaces the current
# loop with a fresh one if it's still going an hour later — `cancel-in-progress:
# true` is deliberate here (unlike every other cron workflow in this repo):
# with `false`, every hourly tick that lands while a ~5h40m loop is still
# running would queue up *another* full ~5h40m loop behind it instead of
# being a no-op, and since each queued run starts its own multi-hour loop
# the moment it's dequeued, that backlog only grows over time — especially
# if GitHub's delivery for this cron ever becomes more reliable than the
# hourly-ish cadence observed everywhere else in this repo. Cancelling and
# restarting instead costs one cheap ~30-60s cache-restore/checkout on
# whichever cadence GitHub actually delivers, with no unbounded backlog risk
# either way.
#
# Self-healing tripwire (added 2026-08-08): the loop body also fails itself
# (non-zero exit) after 5 consecutive cycles where agent_fact_checker.py
# rejects every draft — a real live incident on 2026-08-07/08 saw every LLM
# tier degrade far enough (Groq quota exhausted, weak local fallback
# hallucinating) that this ran green for 12+ hours while publishing nothing,
# completely invisible to workflow_watchdog.yml/retry_failed.yml because
# "fact-checker rejected the draft" is deliberately not a crash — see
# agent_fact_checker.py's own docstring. See the CONSECUTIVE_FLAGGED comment
# further down for the mechanism. This does NOT trip on ordinary "no fresh
# news right now" cycles, which are a normal, expected, non-error outcome.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only — don't publish or post anywhere"
        required: false
        default: false
        type: boolean

concurrency:
  group: transfer-news-bot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  post-transfer-news:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check if a major transfer window is currently open
        id: window
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
            echo "▶ Manual dispatch — running regardless of the seasonal transfer-window gate."
            exit 0
          fi
          # Major European transfer windows this bot tracks: summer (June,
          # July, August — closes on deadline day, end of August) and winter
          # (all of January). Outside these months there's essentially no
          # real transfer news to report, so the bot pauses itself instead of
          # spinning its ~5h50m self-perpetuating loop (see the file-level
          # comment below) for nothing every hour. Deliberately whole-month
          # granularity, not exact deadline-day dates — those shift by a day
          # or two most years and this doesn't need to be that precise; the
          # existing duplicate-title de-dupe in agent_transfer_post.py
          # already prevents padding output even inside an open window.
          MM=$(date -u +%-m)
          if [ "$MM" -eq 1 ] || { [ "$MM" -ge 6 ] && [ "$MM" -le 8 ]; }; then
            echo "open=true" >> "$GITHUB_OUTPUT"
            echo "✅ Transfer window open (UTC month=$MM) — running normally."
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "⏸ Transfer window closed (UTC month=$MM) — pausing until it reopens (1 January or 1 June UTC)."
          fi

      - name: Paused — no transfer window open right now
        if: steps.window.outputs.open != 'true'
        run: echo "Skipping this run entirely — no major transfer window is open. The hourly schedule keeps checking and will resume automatically once one opens."

      - name: Checkout repo
        if: steps.window.outputs.open == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.window.outputs.open == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        if: steps.window.outputs.open == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('agents/python/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      # Added 2026-08-22 — see breaking_news.yml's identical step for why:
      # llm.py's local-Ollama fallback pulls a ~4.9GB model from scratch on
      # every fresh runner otherwise, and this workflow's self-perpetuating
      # 5-min loop can hit that fallback often when Groq is exhausted.
      - name: Cache local Ollama fallback model
        if: steps.window.outputs.open == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ${{ runner.os }}-ollama-llama3.1-8b-v1
          restore-keys: ${{ runner.os }}-ollama-

      - name: Install dependencies
        if: steps.window.outputs.open == 'true'
        run: pip install -r agents/python/requirements.txt

      - name: Install fonts for feature-image generation
        if: steps.window.outputs.open == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core fonts-noto-color-emoji

      - name: Install Playwright browser
        if: steps.window.outputs.open == 'true'
        run: playwright install --with-deps chromium

      - name: Dry-run preview (single check, nothing published)
        if: steps.window.outputs.open == 'true' && github.event.inputs.dry_run == 'true'
        working-directory: agents/python
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_CHANNEL_USERNAME: ${{ secrets.TELEGRAM_CHANNEL_USERNAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_PASSWORD: ${{ secrets.X_PASSWORD }}
          X_EMAIL: ${{ secrets.X_EMAIL }}
          TWITTER_SESSION: ${{ secrets.TWITTER_SESSION }}
        run: python agent_transfer_post.py --dry-run

      # Everything below is one continuous step (not several GitHub Actions
      # steps chained with `if: always()`) because the whole point is an
      # internal loop that outlives any single GitHub-delivered trigger.
      # Each iteration: pull latest → run the bot → regenerate static pages
      # → commit/push whatever was saved, exactly mirroring the previous
      # three-step sequence, just repeated on our own 5-minute timer instead
      # of GitHub's. A failed iteration (e.g. AIProvidersExhausted) still
      # commits/pushes anything already saved, then breaks the loop so the
      # job itself ends in failure — workflow_watchdog.yml / retry_failed.yml
      # pick that up and retry the whole workflow exactly as before.
      - name: Live coverage loop — checks every 5 minutes for up to ~5h50m
        if: steps.window.outputs.open == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_CHANNEL_USERNAME: ${{ secrets.TELEGRAM_CHANNEL_USERNAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_PASSWORD: ${{ secrets.X_PASSWORD }}
          X_EMAIL: ${{ secrets.X_EMAIL }}
          TWITTER_SESSION: ${{ secrets.TWITTER_SESSION }}
        run: |
          set +e
          git config --local user.email "newsbot@sifufinds.com"
          git config --local user.name "SifuFinds Transfer News Bot"

          # 350 minutes minus a little headroom for the setup steps already
          # spent and the final iteration's own runtime, so the job exits
          # cleanly on its own well before GitHub's 360-min hard kill.
          END_TIME=$(( $(date +%s) + 340*60 ))
          EXIT_CODE=0

          # Self-healing tripwire (added 2026-08-08 — see AGENT-KNOWLEDGE.md):
          # a cycle where the fact-checker holds back every draft returns
          # EXIT_CODE 0 (deliberately — a flagged draft isn't a crash, see
          # agent_fact_checker.py's docstring) and "No changes to commit",
          # so the loop just quietly sleeps and tries again forever. Confirmed
          # live 2026-08-07/08: this let the bot run green for 12+ hours
          # while publishing nothing, completely invisible to
          # workflow_watchdog.yml/retry_failed.yml since nothing ever
          # reported as failed. CONSECUTIVE_FLAGGED counts back-to-back
          # cycles where the fact-checker specifically rejected a draft
          # (distinct from "no fresh news", which is a normal, expected,
          # non-error outcome during a quiet news window and must NOT trip
          # this). At the threshold below (~25 min of continuous rejection)
          # the loop deliberately fails the job so the run shows red in
          # `gh run list` and the existing watchdog/retry-failed workflows
          # actually retry it — a fresh process re-probes Groq/g4f from
          # scratch, which a stuck self-perpetuating loop never does on its
          # own since _groq_exhausted_this_process/_g4f_exhausted_this_process
          # are process-scoped and only ever get set, never cleared, once
          # tripped within a single run.
          CONSECUTIVE_FLAGGED=0
          FLAGGED_THRESHOLD=5

          while [ "$(date +%s)" -lt "$END_TIME" ]; do
            ITER_START=$(date +%s)
            echo "▶ Checking for fresh transfer news — $(date -u '+%Y-%m-%d %H:%M:%S') UTC"

            if ! git pull --rebase origin main; then
              echo "⚠️  Pull rebase failed — resetting to origin/main (working tree should be clean at this point, previous cycle already committed/pushed)"
              git rebase --abort 2>/dev/null
              git fetch origin main
              git reset --hard origin/main
            fi

            # Instagram credentials aren't wired into secrets yet (see
            # accumulator_post.yml) — skip it explicitly so every 5-min
            # check doesn't log a "not configured" warning. Output is
            # captured (via `tee`, so it still streams live to the job log)
            # purely to drive the CONSECUTIVE_FLAGGED tripwire above.
            ( cd agents/python && python agent_transfer_post.py --no-instagram ) 2>&1 | tee /tmp/transfer_cycle_output.log
            EXIT_CODE=${PIPESTATUS[0]}

            if grep -q "Fact-checker held back this article" /tmp/transfer_cycle_output.log; then
              CONSECUTIVE_FLAGGED=$(( CONSECUTIVE_FLAGGED + 1 ))
              echo "⚠️  Fact-checker rejected this cycle's draft ($CONSECUTIVE_FLAGGED/$FLAGGED_THRESHOLD consecutive)"
              if [ "$CONSECUTIVE_FLAGGED" -ge "$FLAGGED_THRESHOLD" ]; then
                echo "❌ $FLAGGED_THRESHOLD consecutive cycles rejected by the fact-checker — likely every LLM tier is degraded (weak fallback model hallucinating). Failing this run on purpose so the watchdog/retry-failed workflows retry with a fresh process."
                EXIT_CODE=1
              fi
            else
              CONSECUTIVE_FLAGGED=0
            fi

            python3 gen_blog_post_pages.py

            git add blog/posts.json blog/posts-data.js blog/ assets/og/
            # Separate `git add` call — if this pathspec ever matched nothing
            # (file deleted/missing), a single combined `git add` would fail
            # entirely and silently skip staging the paths above too.
            git add agents/python/covered_stories_state.json 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "No changes to commit this cycle"
            else
              git commit -m "🔄 Transfer news: $(date -u '+%Y-%m-%d %H:%M') UTC"

              PUSHED=0
              for _attempt in 1 2 3 4 5; do
                if git push; then
                  echo "✅ Pushed on attempt $_attempt"
                  PUSHED=1
                  break
                fi
                if [ "$_attempt" -eq 5 ]; then
                  echo "❌ Push failed after 5 attempts"
                  break
                fi
                echo "Push rejected (attempt $_attempt/5) — merging posts and retrying in 5s..."
                sleep 5
                git fetch origin main
                git merge --no-edit origin/main || true
                # This whole step runs under `set +e` (see top of the loop),
                # so a merge_posts.py failure would otherwise fall straight
                # through to `git add -A`/`git commit` below and ship
                # whatever the raw text `git merge` above left in
                # blog/posts.json — including embedded conflict markers.
                # 2026-08-09 incident: exactly this pattern (unchecked
                # merge_posts.py + `set +e`) repeatedly stomped the ~850-post
                # database down to a handful of posts in another workflow.
                # Explicitly check the exit code and fall back to origin's
                # last-known-good posts.json instead of committing a bad merge.
                if ! python3 agents/python/merge_posts.py; then
                  echo "::warning::merge_posts.py failed — resetting blog/posts.json to origin/main instead of committing a possibly-corrupted merge"
                  git checkout origin/main -- blog/posts.json blog/posts-data.js
                fi
                python3 gen_blog_post_pages.py
                git add -A
                git commit -m "🔄 Transfer news: $(date -u '+%Y-%m-%d %H:%M') UTC (merged)" --allow-empty
              done
              if [ "$PUSHED" -ne 1 ]; then
                EXIT_CODE=1
              fi
            fi

            if [ "$EXIT_CODE" -ne 0 ]; then
              echo "⚠️  This cycle failed (exit $EXIT_CODE) — ending the loop so the job reports failure and the watchdog retries the whole workflow."
              break
            fi

            NOW=$(date +%s)
            ITER_ELAPSED=$(( NOW - ITER_START ))
            SLEEP_FOR=$(( 300 - ITER_ELAPSED ))
            if [ "$SLEEP_FOR" -lt 0 ]; then
              SLEEP_FOR=0
            fi
            if [ "$(( NOW + SLEEP_FOR ))" -ge "$END_TIME" ]; then
              echo "Loop window ending — exiting cleanly so the next queued run takes over with no gap."
              break
            fi
            echo "Sleeping ${SLEEP_FOR}s until the next check..."
            sleep "$SLEEP_FOR"
          done

          exit $EXIT_CODE
