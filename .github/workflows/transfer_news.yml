name: Transfer News Bot — Live coverage every 5 minutes

# GitHub Actions' scheduler does not reliably deliver high-frequency cron
# triggers on an account running this many concurrent scheduled workflows.
# Verified empirically on this repo on 2026-07-27: this workflow's
# "*/5 * * * *" cron was actually firing roughly once per hour (sometimes
# with 3+ hour gaps) — and live_odds.yml (also "*/5 * * * *") and
# hourly_scrape.yml (also "*/15 * * * *") showed the exact same ~hourly
# real-world cadence regardless of their configured interval. That means
# GitHub is dropping the vast majority of scheduled events account-wide, not
# misreading any one workflow's cron expression — editing cron syntax alone
# cannot fix this.
#
# Fix: this job is self-perpetuating instead of relying on GitHub to deliver
# every tick. Once a run actually starts (whenever GitHub gets around to
# firing the trigger below), it loops internally on its own clock — checking
# for fresh transfer news every 5 minutes — for up to ~5h50m, just under
# GitHub-hosted runners' 6-hour hard cap on a single job. The real 5-minute
# cadence comes from that internal loop, not from GitHub's cron delivery.
#
# The hourly schedule below is just a backstop that replaces the current
# loop with a fresh one if it's still going an hour later — `cancel-in-progress:
# true` is deliberate here (unlike every other cron workflow in this repo):
# with `false`, every hourly tick that lands while a ~5h40m loop is still
# running would queue up *another* full ~5h40m loop behind it instead of
# being a no-op, and since each queued run starts its own multi-hour loop
# the moment it's dequeued, that backlog only grows over time — especially
# if GitHub's delivery for this cron ever becomes more reliable than the
# hourly-ish cadence observed everywhere else in this repo. Cancelling and
# restarting instead costs one cheap ~30-60s cache-restore/checkout on
# whichever cadence GitHub actually delivers, with no unbounded backlog risk
# either way.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only — don't publish or post anywhere"
        required: false
        default: false
        type: boolean

concurrency:
  group: transfer-news-bot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  post-transfer-news:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('agents/python/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r agents/python/requirements.txt

      - name: Install fonts for feature-image generation
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core fonts-noto-color-emoji

      - name: Dry-run preview (single check, nothing published)
        if: github.event.inputs.dry_run == 'true'
        working-directory: agents/python
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_CHANNEL_USERNAME: ${{ secrets.TELEGRAM_CHANNEL_USERNAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_PASSWORD: ${{ secrets.X_PASSWORD }}
          X_EMAIL: ${{ secrets.X_EMAIL }}
          TWITTER_SESSION: ${{ secrets.TWITTER_SESSION }}
        run: python agent_transfer_post.py --dry-run

      # Everything below is one continuous step (not several GitHub Actions
      # steps chained with `if: always()`) because the whole point is an
      # internal loop that outlives any single GitHub-delivered trigger.
      # Each iteration: pull latest → run the bot → regenerate static pages
      # → commit/push whatever was saved, exactly mirroring the previous
      # three-step sequence, just repeated on our own 5-minute timer instead
      # of GitHub's. A failed iteration (e.g. AIProvidersExhausted) still
      # commits/pushes anything already saved, then breaks the loop so the
      # job itself ends in failure — workflow_watchdog.yml / retry_failed.yml
      # pick that up and retry the whole workflow exactly as before.
      - name: Live coverage loop — checks every 5 minutes for up to ~5h50m
        if: github.event.inputs.dry_run != 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_CHANNEL_USERNAME: ${{ secrets.TELEGRAM_CHANNEL_USERNAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_PASSWORD: ${{ secrets.X_PASSWORD }}
          X_EMAIL: ${{ secrets.X_EMAIL }}
          TWITTER_SESSION: ${{ secrets.TWITTER_SESSION }}
        run: |
          set +e
          git config --local user.email "newsbot@sifufinds.com"
          git config --local user.name "SifuFinds Transfer News Bot"

          # 350 minutes minus a little headroom for the setup steps already
          # spent and the final iteration's own runtime, so the job exits
          # cleanly on its own well before GitHub's 360-min hard kill.
          END_TIME=$(( $(date +%s) + 340*60 ))
          EXIT_CODE=0

          while [ "$(date +%s)" -lt "$END_TIME" ]; do
            ITER_START=$(date +%s)
            echo "▶ Checking for fresh transfer news — $(date -u '+%Y-%m-%d %H:%M:%S') UTC"

            if ! git pull --rebase origin main; then
              echo "⚠️  Pull rebase failed — resetting to origin/main (working tree should be clean at this point, previous cycle already committed/pushed)"
              git rebase --abort 2>/dev/null
              git fetch origin main
              git reset --hard origin/main
            fi

            # Instagram credentials aren't wired into secrets yet (see
            # accumulator_post.yml) — skip it explicitly so every 5-min
            # check doesn't log a "not configured" warning.
            ( cd agents/python && python agent_transfer_post.py --no-instagram )
            EXIT_CODE=$?

            python3 gen_blog_post_pages.py

            git add blog/posts.json blog/posts-data.js blog/ assets/og/
            if git diff --cached --quiet; then
              echo "No changes to commit this cycle"
            else
              git commit -m "🔄 Transfer news: $(date -u '+%Y-%m-%d %H:%M') UTC"

              PUSHED=0
              for _attempt in 1 2 3 4 5; do
                if git push; then
                  echo "✅ Pushed on attempt $_attempt"
                  PUSHED=1
                  break
                fi
                if [ "$_attempt" -eq 5 ]; then
                  echo "❌ Push failed after 5 attempts"
                  break
                fi
                echo "Push rejected (attempt $_attempt/5) — merging posts and retrying in 5s..."
                sleep 5
                git fetch origin main
                git merge --no-edit origin/main || true
                python3 agents/python/merge_posts.py
                python3 gen_blog_post_pages.py
                git add -A
                git commit -m "🔄 Transfer news: $(date -u '+%Y-%m-%d %H:%M') UTC (merged)" --allow-empty
              done
              if [ "$PUSHED" -ne 1 ]; then
                EXIT_CODE=1
              fi
            fi

            if [ "$EXIT_CODE" -ne 0 ]; then
              echo "⚠️  This cycle failed (exit $EXIT_CODE) — ending the loop so the job reports failure and the watchdog retries the whole workflow."
              break
            fi

            NOW=$(date +%s)
            ITER_ELAPSED=$(( NOW - ITER_START ))
            SLEEP_FOR=$(( 300 - ITER_ELAPSED ))
            if [ "$SLEEP_FOR" -lt 0 ]; then
              SLEEP_FOR=0
            fi
            if [ "$(( NOW + SLEEP_FOR ))" -ge "$END_TIME" ]; then
              echo "Loop window ending — exiting cleanly so the next queued run takes over with no gap."
              break
            fi
            echo "Sleeping ${SLEEP_FOR}s until the next check..."
            sleep "$SLEEP_FOR"
          done

          exit $EXIT_CODE
