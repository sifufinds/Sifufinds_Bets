name: Breaking News Bot — Auto-publish 3x daily

on:
  schedule:
    # 3x per day: 08:00, 14:00, 20:00 WAT (07:00, 13:00, 19:00 UTC)
    - cron: "0 7 * * *"
    - cron: "0 13 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI

# Prevent two runs colliding and creating git push conflicts
concurrency:
  group: breaking-news-bot
  cancel-in-progress: false  # queue the next run, don't discard it

permissions:
  contents: write

jobs:
  publish-breaking-news:
    runs-on: ubuntu-latest
    # 40 min (was 15): confirmed live 2026-08-02 that 15min was no longer enough
    # and was actively discarding real work — two runs that day each completed
    # a full first-category article successfully, then got killed by the job
    # timeout partway through the second category, with the commit/push step
    # never reached (conclusion: "cancelled", not "failure", so nothing was
    # even flagged as broken; only found via a manual run-history audit).
    # Root cause: the 2026-08-01 local Ollama fallback tier in llm.py (see
    # AGENT-KNOWLEDGE.md) sits between Groq and Gemini/Claude and adds real
    # wall-clock time the original 15min budget never accounted for — a
    # one-time ~1-3min install+model-pull the first time any of this job's 3
    # sequential generate_post() calls falls all the way through Groq, plus
    # CPU-only inference time for whichever calls actually use it. Combined
    # with the original ~2min-per-call Groq RPM-retry budget this comment
    # used to size 15min against, worst case across 3 categories now
    # genuinely needs more room. 40min gives real headroom while staying far
    # under GitHub's 360min hard job cap.
    #
    # Bumped to 45min (2026-08-08) alongside adding per-call `timeout`
    # wrappers around every agent_sports_blog.py invocation below: the
    # per-call caps (10min x3 categories + 5min ticker = 35min worst case)
    # are now the real backstop that should almost never be exhausted, and
    # this job-level ceiling exists only as a last resort so setup-step
    # slowness on a bad day still can't reach the unretryable
    # "cancelled"-by-external-timeout state documented below.
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest content (avoid stale reads)
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('agents/python/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      # Added 2026-08-22: llm.py's local-Ollama fallback tier (only reached
      # after Groq AND g4f both fail) pulls a ~4.9GB model on every fresh
      # ephemeral runner with nothing cached — confirmed live as the cause
      # of the football category timing out at its full 600s with zero
      # output. Caching ~/.ollama means only the very first run after a
      # cache-key change pays that cost; every run after restores the blob
      # in seconds instead of re-downloading it.
      - name: Cache local Ollama fallback model
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ${{ runner.os }}-ollama-llama3.1-8b-v1
          restore-keys: ${{ runner.os }}-ollama-

      - name: Install dependencies
        run: pip install -r agents/python/requirements.txt

      - name: Install fonts for feature-image generation
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core fonts-noto-color-emoji

      - name: Run Sports Blog Agent — Football + Sport News
        id: cat_football_sportnews
        working-directory: agents/python
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          # Each call capped at 10 min (added 2026-08-08): the job's own
          # 40-min timeout-minutes was already raised once (see comment
          # above) to cover the local-Ollama fallback tier's install+pull+
          # generate time, but the SAME DAY llm.py's fallback model was
          # upgraded 3b→8b ("needs more headroom" — see its own comment),
          # silently invalidating that sizing again.
          #
          # Each call is now `|| true` (added 2026-08-10): a single category
          # hitting this timeout used to fail the ENTIRE step outright
          # (GitHub Actions runs `run:` blocks under `bash -e`), which meant
          # sportnews never even got attempted, and — because a failed step
          # skips every later step by default — the Rotating category step,
          # the ticker step, and the commit/push step all got skipped too.
          # Confirmed live 2026-08-09: a run that successfully generated the
          # football article still published nothing that cycle because
          # sportnews's Ollama fallback ran past 600s. `|| true` isolates
          # each category so one slow/exhausted attempt can't take the
          # others down with it; FAILED_CATEGORIES (surfaced as a step
          # output, checked by the final step below) still gets the run
          # reported as failed — so workflow_watchdog.yml/retry_failed.yml
          # still retry a degraded run — but only AFTER whatever did
          # succeed this cycle has already been committed and pushed.
          FAILED=""
          timeout 600 python agent_sports_blog.py --category football || { echo "⚠️  football category failed/timed out — continuing to sportnews"; FAILED="$FAILED football"; }
          timeout 600 python agent_sports_blog.py --category sportnews || { echo "⚠️  sportnews category failed/timed out — continuing"; FAILED="$FAILED sportnews"; }
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Run Sports Blog Agent — Rotating category (all 10 covered daily)
        id: cat_rotating
        working-directory: agents/python
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          # Rotate all 10 blog categories across the day in 2-hour windows.
          # 10-min per-call cap, non-fatal on timeout/failure — see the
          # step above for why this must never take down later steps.
          HOUR=$(date -u +%H)
          CATEGORY=basketball
          if   [ "$HOUR" -lt 7  ]; then CATEGORY=basketball
          elif [ "$HOUR" -lt 9  ]; then CATEGORY=betting
          elif [ "$HOUR" -lt 11 ]; then CATEGORY=tennis
          elif [ "$HOUR" -lt 13 ]; then CATEGORY=cricket
          elif [ "$HOUR" -lt 15 ]; then CATEGORY=rugby
          elif [ "$HOUR" -lt 17 ]; then CATEGORY=boxing
          elif [ "$HOUR" -lt 19 ]; then CATEGORY=f1
          elif [ "$HOUR" -lt 21 ]; then CATEGORY=igaming
          fi
          FAILED=""
          timeout 600 python agent_sports_blog.py --category "$CATEGORY" || { echo "⚠️  $CATEGORY category failed/timed out — continuing"; FAILED="$CATEGORY"; }
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Update live ticker
        id: ticker
        working-directory: agents/python
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          FAILED=""
          timeout 300 python agent_sports_blog.py --ticker-only || { echo "⚠️  ticker update failed/timed out — continuing"; FAILED="ticker"; }
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Generate static blog post pages
        run: python3 gen_blog_post_pages.py

      - name: Commit and push new articles
        run: |
          git config --local user.email "newsbot@sifufinds.com"
          git config --local user.name "SifuFinds Breaking News Bot"
          git add blog/posts.json blog/posts-data.js blog/ticker.json blog/ticker-data.js blog/ assets/og/
          git add agents/python/covered_stories_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "🔴 Breaking news: $(date -u '+%Y-%m-%d %H:%M') UTC"

          # Retry push up to 5 times — handles concurrent bot pushes
          for _attempt in 1 2 3 4 5; do
            if git push; then
              echo "✅ Pushed on attempt $_attempt"
              break
            fi
            if [ "$_attempt" -eq 5 ]; then
              echo "❌ Push failed after 5 attempts"
              exit 1
            fi
            echo "Push rejected (attempt $_attempt/5) — merging posts and retrying in 5s..."
            sleep 5
            git fetch origin main
            # Plain merge instead of reset+rebase: rebase requires a clean
            # working tree, but regenerating pages below always leaves one
            # dirty (regenerated files differ from whatever a reset staged)
            # — that combination reliably fails with "cannot rebase: you
            # have unstaged changes" (seen repeatedly in run history). A
            # merge has no such requirement; conflicts it leaves in
            # generated files (blog/*/index.html) are moot because
            # regenerating overwrites them from scratch anyway.
            git merge --no-edit origin/main || true
            # Smart-merge posts.json so no posts are lost from either side
            python3 agents/python/merge_posts.py
            # Regenerate pages on top of merged posts
            python3 gen_blog_post_pages.py
            git add -A
            git commit -m "🔴 Breaking news: $(date -u '+%Y-%m-%d %H:%M') UTC (merged)" --allow-empty
          done

      - name: Report degraded categories
        if: always()
        run: |
          # Runs last, after content that DID succeed is already committed
          # and pushed above. Any category that timed out/failed still fails
          # this job on purpose (non-empty FAILED) so workflow_watchdog.yml /
          # retry_failed.yml pick it up and retry — see the 2026-08-10 note
          # on the "Football + Sport News" step for why this is now split
          # out from the generation steps themselves instead of letting one
          # slow category take the whole job (and every category after it)
          # down before anything could be published.
          FAILED="${{ steps.cat_football_sportnews.outputs.failed }} ${{ steps.cat_rotating.outputs.failed }} ${{ steps.ticker.outputs.failed }}"
          FAILED="$(echo "$FAILED" | xargs)"
          if [ -n "$FAILED" ]; then
            echo "::warning::Degraded categories this run: $FAILED"
            exit 1
          fi
          echo "✅ All categories completed cleanly this run"
