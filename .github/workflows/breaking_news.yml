name: Breaking News Bot — Auto-publish 3x daily

on:
  schedule:
    # 3x per day: 08:00, 14:00, 20:00 WAT (07:00, 13:00, 19:00 UTC)
    - cron: "0 7 * * *"
    - cron: "0 13 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI

# Prevent two runs colliding and creating git push conflicts
concurrency:
  group: breaking-news-bot
  cancel-in-progress: false  # queue the next run, don't discard it

permissions:
  contents: write

jobs:
  publish-breaking-news:
    runs-on: ubuntu-latest
    # 15 min (was 10): 3 sequential generate_post() calls can each burn up to
    # ~2min in Groq RPM-limit retry waits (see llm.py _parse_retry_seconds cap)
    # before falling through to Gemini — 10min was tight enough that legitimate
    # runs got killed mid-write by the job timeout rather than failing cleanly.
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest content (avoid stale reads)
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('agents/python/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r agents/python/requirements.txt

      - name: Run Sports Blog Agent — Football + Sport News
        working-directory: agents/python
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python agent_sports_blog.py --category football
          python agent_sports_blog.py --category sportnews

      - name: Run Sports Blog Agent — Rotating category (all 10 covered daily)
        working-directory: agents/python
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          # Rotate all 10 blog categories across the day in 2-hour windows
          HOUR=$(date -u +%H)
          if   [ "$HOUR" -lt 7  ]; then python agent_sports_blog.py --category basketball
          elif [ "$HOUR" -lt 9  ]; then python agent_sports_blog.py --category betting
          elif [ "$HOUR" -lt 11 ]; then python agent_sports_blog.py --category tennis
          elif [ "$HOUR" -lt 13 ]; then python agent_sports_blog.py --category cricket
          elif [ "$HOUR" -lt 15 ]; then python agent_sports_blog.py --category rugby
          elif [ "$HOUR" -lt 17 ]; then python agent_sports_blog.py --category boxing
          elif [ "$HOUR" -lt 19 ]; then python agent_sports_blog.py --category f1
          elif [ "$HOUR" -lt 21 ]; then python agent_sports_blog.py --category igaming
          else python agent_sports_blog.py --category basketball
          fi

      - name: Update live ticker
        working-directory: agents/python
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent_sports_blog.py --ticker-only

      - name: Generate static blog post pages
        run: python3 gen_blog_post_pages.py

      - name: Commit and push new articles
        run: |
          git config --local user.email "newsbot@sifufinds.com"
          git config --local user.name "SifuFinds Breaking News Bot"
          git add blog/posts.json blog/posts-data.js blog/ticker.json blog/ticker-data.js blog/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "🔴 Breaking news: $(date -u '+%Y-%m-%d %H:%M') UTC"

          # Retry push up to 5 times — handles concurrent bot pushes
          for _attempt in 1 2 3 4 5; do
            if git push; then
              echo "✅ Pushed on attempt $_attempt"
              break
            fi
            if [ "$_attempt" -eq 5 ]; then
              echo "❌ Push failed after 5 attempts"
              exit 1
            fi
            echo "Push rejected (attempt $_attempt/5) — merging posts and retrying in 5s..."
            sleep 5
            git fetch origin main
            # Plain merge instead of reset+rebase: rebase requires a clean
            # working tree, but regenerating pages below always leaves one
            # dirty (regenerated files differ from whatever a reset staged)
            # — that combination reliably fails with "cannot rebase: you
            # have unstaged changes" (seen repeatedly in run history). A
            # merge has no such requirement; conflicts it leaves in
            # generated files (blog/*/index.html) are moot because
            # regenerating overwrites them from scratch anyway.
            git merge --no-edit origin/main || true
            # Smart-merge posts.json so no posts are lost from either side
            python3 agents/python/merge_posts.py
            # Regenerate pages on top of merged posts
            python3 gen_blog_post_pages.py
            git add -A
            git commit -m "🔴 Breaking news: $(date -u '+%Y-%m-%d %H:%M') UTC (merged)" --allow-empty
          done
