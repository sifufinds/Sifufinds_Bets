name: Retry Safety Net — every 30 minutes

# Safety net that polls every 30 min and re-triggers any workflow whose
# last completed run ended in failure.  Complements the event-driven
# workflow_watchdog.yml — catches cases where the watchdog itself failed
# or a retried run also failed.
#
# Skips workflows that are currently in_progress / queued / waiting so
# we never double-fire alongside a live run.

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes, 24/7
  workflow_dispatch:

permissions:
  actions: write

jobs:
  retry-all:
    name: Scan all workflows and retry failures
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check and retry failed workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e

          WORKFLOWS=(
            "brand_scraper.yml"
            "breaking_news.yml"
            "deploy_hostinger.yml"
            "firecrawl_odds.yml"
            "hourly_scrape.yml"
            "live_odds.yml"
            "seo_backlinks.yml"
            "seo_sitemap.yml"
            "site_doctor.yml"
            "site_monitor.yml"
            "telegram_growth.yml"
            "telegram_offers.yml"
            "telegram_outreach.yml"
            "traffic_report.yml"
            "twitter_posts.yml"
            "update_countries_live.yml"
            "update_predictions.yml"
          )

          RETRIED=0
          SKIPPED=0
          OK=0

          for WF in "${WORKFLOWS[@]}"; do
            INFO=$(gh run list \
              --workflow="$WF" \
              --repo "$REPO" \
              --limit 1 \
              --json conclusion,status \
              --jq '.[0] | {conclusion: (.conclusion // ""), status: (.status // "")}' 2>/dev/null)

            CONCLUSION=$(echo "$INFO" | jq -r '.conclusion')
            STATUS=$(echo "$INFO"     | jq -r '.status')

            # Skip if a run is already active
            if [ "$STATUS" = "in_progress" ] || [ "$STATUS" = "queued" ] || [ "$STATUS" = "waiting" ]; then
              echo "⏳  $WF — currently $STATUS, skipping"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            if [ "$CONCLUSION" = "failure" ]; then
              echo "⚠️  $WF — last run FAILED, re-triggering..."
              if gh workflow run "$WF" --repo "$REPO" --ref main; then
                echo "✅  $WF re-triggered"
                RETRIED=$((RETRIED + 1))
              else
                echo "⚠️  Could not re-trigger $WF"
              fi
            else
              echo "✅  $WF — $CONCLUSION"
              OK=$((OK + 1))
            fi
          done

          echo ""
          echo "━━━ Safety Net Summary ━━━"
          echo "  OK      : $OK"
          echo "  Active  : $SKIPPED"
          echo "  Retried : $RETRIED"
          exit 0
