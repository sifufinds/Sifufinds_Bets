name: SERP Monitor — track rank position over time

# Runs agents/python/agent_serp_monitor.py, which checks a batch of the
# rank-tracking watchlist (bookmaker reviews + evergreen comparisons/tools)
# per run and appends to agents/python/serp_rank_history.json. Flags a
# REGRESSION (position worse by 5+, or dropped out of the top 10 entirely)
# to agents/python/serp_regressions.json for visibility. No historical
# rank-tracking storage existed anywhere in this repo before this agent.
#
# This workflow never exits with a failure code — a rate-limited run just
# means fewer keywords checked this time; it tries again on the next
# scheduled run.

on:
  schedule:
    - cron: "45 1 * * *"
  workflow_dispatch:

concurrency:
  group: agent-serp-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    name: Check next batch of the SERP watchlist
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('agents/python/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r agents/python/requirements.txt

      - name: Run SERP Monitoring agent
        id: monitor
        working-directory: agents/python
        run: |
          set +e
          python agent_serp_monitor.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit and push rank history
        run: |
          git config --local user.email "serp-monitor@sifufinds.com"
          git config --local user.name "SifuFinds SERP Monitor"
          git add agents/python/serp_rank_history.json agents/python/serp_regressions.json
          if git diff --cached --quiet; then
            echo "No rank data changed this run — nothing to commit"
            exit 0
          fi
          git commit -m "monitor: SERP rank check $(date -u '+%Y-%m-%d') UTC"

          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "✅ Pushed on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "❌ Push failed after 5 attempts"
              exit 1
            fi
            sleep 5
            git fetch origin main
            git merge --no-edit origin/main || true
            git add -A
            git commit -m "monitor: SERP rank check $(date -u '+%Y-%m-%d') UTC (merged)" --allow-empty
          done

      - name: Report outcome
        if: always()
        run: |
          CODE="${{ steps.monitor.outputs.exit_code }}"
          if [ -z "$CODE" ] || [ "$CODE" = "0" ]; then
            echo "✅ SERP Monitoring agent ran — see logs above"
          else
            echo "⚠️ SERP Monitoring agent exit code $CODE — check logs above"
          fi
