name: Workflow Watchdog — auto-retry failed workflows

# Triggers whenever a watched workflow finishes with failure.
# Time-critical workflows (live_odds, site_doctor, site_monitor) are
# retried immediately.
# Deploy and traffic_report failures are handled by retry_failed.yml
# which polls every 2 hours — avoids wasting runner minutes sleeping.

on:
  workflow_run:
    workflows:
      - "Site Monitor — auto-heal sifufinds.com"
      - "Site Doctor — 24/7 auto-heal sifufinds.com"
      - "Live Odds — Update every 5 minutes"
    types: [completed]

permissions:
  actions: write

jobs:
  watchdog:
    name: Watchdog re-trigger on failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.workflow_run.conclusion == 'failure'

    steps:
      - name: Log failure
        run: |
          echo "⚠️ Workflow failed: ${{ github.event.workflow_run.name }}"
          echo "   Run ID    : ${{ github.event.workflow_run.id }}"
          echo "   Branch    : ${{ github.event.workflow_run.head_branch }}"
          echo "   Conclusion: ${{ github.event.workflow_run.conclusion }}"

      - name: Re-trigger live_odds if that was the failing workflow
        if: github.event.workflow_run.name == 'Live Odds — Update every 5 minutes'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "Live odds workflow failed — re-triggering..."
          if gh workflow run live_odds.yml \
            --repo "${{ github.repository }}" \
            --ref main; then
            echo "✅ live_odds.yml re-triggered"
          else
            echo "⚠️ Could not re-trigger live_odds.yml"
          fi
          exit 0

      - name: Re-trigger site_doctor for all other failures
        if: github.event.workflow_run.name != 'Live Odds — Update every 5 minutes'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "Re-triggering site_doctor.yml to attempt auto-heal..."
          if gh workflow run site_doctor.yml \
            --repo "${{ github.repository }}" \
            --ref main; then
            echo "✅ site_doctor.yml re-triggered"
          else
            echo "⚠️ Could not re-trigger site_doctor.yml"
          fi
          exit 0
