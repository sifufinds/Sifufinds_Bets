name: Workflow Watchdog — auto-retry all failed workflows

# Fires the moment any watched workflow completes with failure.
# Waits 10 min (transient errors / rate limits) then re-triggers the
# exact same workflow.  Loop guard: skips if the failing run was itself
# triggered by github-actions[bot] (i.e. already a retry).

on:
  workflow_run:
    workflows:
      - "Brand Bonus Scraper — Daily Update"
      - "Breaking News Bot — Auto-publish 3x daily"
      - "Deploy to Hostinger — sifufinds.com"
      - "Firecrawl Odds — Daily African match data"
      - "Hourly Multi-Source Scrape — Flashscore, Sofascore, Livescore, OddsPortal, BetExplorer, OddsChecker"
      - "Live Odds — Update every 5 minutes"
      - "SEO Backlink Outreach — Hourly"
      - "SEO — Update sitemap lastmod after blog publish"
      - "Site Doctor — 24/7 auto-heal sifufinds.com"
      - "Site Monitor — auto-heal sifufinds.com"
      - "Telegram Channel Growth — Post in African groups 3x/day"
      - "Telegram Brand Offers — Post every 3 hours"
      - "Telegram Outreach — Scrape + DM sequence"
      - "Traffic Report — GoatCounter daily snapshot"
      - "X (Twitter) Posts — 4x daily rotating content"
      - "Update Countries Live Data — Bookmaker Offers & Country Stats"
      - "SifuKaii Predicts — Scrape predictz.com every 15 minutes"
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write

jobs:
  watchdog:
    name: Re-trigger failed workflow after 10 min
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.triggering_actor.login != 'github-actions[bot]'

    steps:
      - name: Log failure
        run: |
          echo "⚠️  FAILED : ${{ github.event.workflow_run.name }}"
          echo "    Run ID : ${{ github.event.workflow_run.id }}"
          echo "    Actor  : ${{ github.event.workflow_run.triggering_actor.login }}"
          echo "    Branch : ${{ github.event.workflow_run.head_branch }}"
          echo "⏳  Waiting 10 minutes before retry..."

      - name: Wait 10 minutes
        run: sleep 600

      - name: Re-trigger the failed workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set +e
          case "$WORKFLOW_NAME" in
            "Brand Bonus Scraper — Daily Update")                                         WF=brand_scraper.yml ;;
            "Breaking News Bot — Auto-publish 3x daily")                                  WF=breaking_news.yml ;;
            "Deploy to Hostinger — sifufinds.com")                                        WF=deploy_hostinger.yml ;;
            "Firecrawl Odds — Daily African match data")                                  WF=firecrawl_odds.yml ;;
            "Hourly Multi-Source Scrape"*)                                                WF=hourly_scrape.yml ;;
            "Live Odds — Update every 5 minutes")                                        WF=live_odds.yml ;;
            "SEO Backlink Outreach — Hourly")                                             WF=seo_backlinks.yml ;;
            "SEO — Update sitemap"*)                                                      WF=seo_sitemap.yml ;;
            "Site Doctor"*)                                                               WF=site_doctor.yml ;;
            "Site Monitor"*)                                                              WF=site_monitor.yml ;;
            "Telegram Channel Growth"*)                                                   WF=telegram_growth.yml ;;
            "Telegram Brand Offers"*)                                                     WF=telegram_offers.yml ;;
            "Telegram Outreach"*)                                                         WF=telegram_outreach.yml ;;
            "Traffic Report"*)                                                            WF=traffic_report.yml ;;
            "X (Twitter) Posts"*)                                                         WF=twitter_posts.yml ;;
            "Update Countries Live Data"*)                                                WF=update_countries_live.yml ;;
            "SifuKaii Predicts"*)                                                        WF=update_predictions.yml ;;
            *)
              echo "⚠️  Unknown workflow name: $WORKFLOW_NAME — cannot map to file, skipping"
              exit 0
              ;;
          esac

          echo "🔁  Re-triggering $WF..."
          if gh workflow run "$WF" \
               --repo "${{ github.repository }}" \
               --ref main; then
            echo "✅  $WF re-triggered successfully"
          else
            echo "⚠️  Could not re-trigger $WF (will be caught by 30-min safety net)"
          fi
          exit 0
