name: Accumulator Post — Weekend/Weekday 5-Fold, 2x per day

on:
  schedule:
    # 2x per day, matching the "lunch tips + evening tips" daily content strategy:
    #   11:00 UTC = 12:00 WAT / 14:00 EAT — Best Prediction & Tips of the Day (lunch)
    #   18:00 UTC = 19:00 WAT / 21:00 EAT — Evening Predictions & Tips
    # Deliberately down from 5x/day while the audience is still growing, so each post
    # gets room to gain views before the next one lands. Once the football season is
    # properly underway, scale back up to 3-5 prediction posts/day by adding more cron
    # lines here — but only with genuinely strong tips, not volume for its own sake.
    # Also posts to Facebook (photo + generated branded image + link to a real
    # tips-flavoured blog post when one exists) once FACEBOOK_PAGE_ID /
    # FACEBOOK_PAGE_ACCESS_TOKEN secrets are set — skips cleanly until then.
    - cron: "0 11 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      type:
        description: "Accumulator type (auto detects weekend/weekday from the UTC day)"
        required: false
        default: "auto"
        type: choice
        options: ["auto", "weekend", "weekday"]
      stake:
        description: "Example stake in ₦ used for the return calc"
        required: false
        default: "1000"

concurrency:
  group: accumulator-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post-accumulator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('agents/python/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r agents/python/requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Post accumulator to Telegram + Facebook + X
        working-directory: agents/python
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_CHANNEL_USERNAME: ${{ secrets.TELEGRAM_CHANNEL_USERNAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_PASSWORD: ${{ secrets.X_PASSWORD }}
          X_EMAIL: ${{ secrets.X_EMAIL }}
          TWITTER_SESSION: ${{ secrets.TWITTER_SESSION }}
        run: |
          TYPE="${{ github.event.inputs.type }}"
          STAKE="${{ github.event.inputs.stake }}"
          # Instagram credentials aren't configured yet (see FB_SETUP_SIMPLE.md) —
          # skip it explicitly rather than log a failed attempt on every scheduled run.
          python agent_accumulator_post.py --type "${TYPE:-auto}" --stake "${STAKE:-1000}" \
            --no-instagram

      - name: Commit updated state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "agents@sifufinds.com"
          git config --local user.name "SifuFinds Agent"
          git add agents/python/facebook_share_state.json agents/python/agent_log.json || true
          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "accumulator: posted $(date -u '+%Y-%m-%d %H:%M') UTC"

          for _attempt in 1 2 3 4 5; do
            if git push; then
              echo "✅ Pushed on attempt $_attempt"
              break
            fi
            if [ "$_attempt" -eq 5 ]; then
              echo "❌ Push failed after 5 attempts"
              exit 1
            fi
            echo "⚠ Push rejected (attempt $_attempt/5) — rebasing in 5s..."
            sleep 5
            git fetch origin main
            git rebase FETCH_HEAD -X theirs || git rebase --abort
          done
