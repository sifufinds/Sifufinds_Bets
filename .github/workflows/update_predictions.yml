name: SifuKaii Predicts — Scrape predictz.com 4x daily

# Was every 15 minutes (96 runs/day) — this script calls Firecrawl + Apify
# exclusively for 8 URLs per run with zero free-tier fallback (its regex
# parser needs Firecrawl's specific markdown link syntax; trafilatura/Jina
# Reader were tested live and don't preserve those links for this site, so
# unlike every other scraper in this repo it couldn't be migrated to
# free_scrape.py — see AGENT-KNOWLEDGE.md 2026-07-28). At 96 runs/day this
# was the single largest Firecrawl consumer in the whole repo and the
# primary reason the account ran out of credits in its first week. None of
# this data's consumers (agent_accumulator_post.py: 2x/day;
# agent_match_post.py: on-demand/manual) need 15-minute freshness — cut to
# 4x/day, timed just ahead of the accumulator's 11:00/18:00 UTC posts, which
# cuts Firecrawl exposure by ~24x while keeping data fresh enough for every
# real consumer.
on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 10 * * *"
    - cron: "0 16 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:   # manual trigger from GitHub UI

concurrency:
  group: update-predictions
  cancel-in-progress: false   # queue runs, never drop a scrape

permissions:
  contents: write
  actions: write

jobs:
  scrape-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      APIFY_API_TOKEN:   ${{ secrets.APIFY_API_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pull latest (avoid stale reads)
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests --quiet

      - name: Run predictions scraper
        run: python3 update_predictions.py
        continue-on-error: true   # never block on scrape failure

      - name: Commit updated predictions
        id: commit
        run: |
          git config user.name  "SifuKaii Predicts Bot"
          git config user.email "scrapebot@sifufinds.com"
          git add data/predictions.json
          if git diff --cached --quiet; then
            echo "ℹ No prediction changes — nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          COUNT=$(python3 -c "import json; d=json.load(open('data/predictions.json')); print(d.get('count',0))" 2>/dev/null || echo "?")
          git commit -m "live: predictions update $(date -u '+%Y-%m-%d %H:%M') UTC — ${COUNT} matches"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "✅ Pushed on attempt $attempt"
              break
            fi
            [ "$attempt" -eq 5 ] && { echo "❌ Push failed after 5 attempts"; exit 1; }
            echo "⚠ Push rejected ($attempt/5) — rebasing…"
            sleep $((attempt * 3))
            git fetch origin main
            git rebase FETCH_HEAD -X theirs || git rebase --abort
          done

      - name: Trigger Hostinger deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy_hostinger.yml/dispatches" \
            -d '{"ref":"main"}' | grep -qE '^(204|2[0-9][0-9])' \
            && echo "✅ Deploy triggered" \
            || echo "⚠ Deploy trigger failed (non-fatal)"
