name: Priority Content — write evergreen guides + country trending posts from keyword gaps

# Closes the loop found 2026-08-01/02: keyword-gap research alone never
# turned into scheduled content. Each loop iteration runs the pipeline end
# to end:
#   1. agent_content_priority.py — re-rank keyword_opportunities.json +
#      trending_keywords.json into content_priority_queue.json (country
#      tier x content type x recency).
#   2. agent_priority_writer.py — write real, SEO-optimised evergreen guide
#      posts (best betting sites/bonus, how to bet online, safest apps)
#      for the top un-actioned queue items, grounded in the site's own real
#      per-country bookmaker/bonus data (utils/site_data.py), never news
#      headlines.
#   3. agent_country_trending_writer.py — added 2026-08-08: writes real,
#      country-specific trending posts for queue items agent_content_
#      priority.py marked writer-actionable (i.e. NOT already covered by
#      breaking_news.yml's pan-African 3x/day schedule, checked against the
#      shared utils/story_dedup.py registry). Closes the gap where
#      agent_trending_keywords.py's now-genuinely-per-country research (see
#      that module's docstring) was found but never turned into a post.
#
# 2026-08-02: switched to a self-perpetuating internal loop instead of
# relying on GitHub to deliver every "0 */2 * * *" tick. Confirmed live on
# this repo tonight (see retry_failed.yml's 2026-08-02 fix and
# transfer_news.yml's 2026-07-27 fix) that this account's scheduler drops
# most cron ticks under load — this workflow's own first night showed a
# ~5 hour gap with only one scheduled run firing. Once a run does start
# (whenever GitHub gets around to it), it now loops on its own clock every
# ~2 hours for up to ~5h50m, so the real cadence comes from the loop, not
# from GitHub's delivery. Each individual write attempt is wrapped in
# `timeout` — the run that did fire tonight was killed by the old 20-minute
# job timeout mid-generation, because a Groq-quota-exhausted attempt falls
# through to llm.py's local Ollama fallback, which pulls a fresh ~2GB model
# on every ephemeral runner and can genuinely take a while; a stuck/slow
# attempt must not be able to block the rest of the loop.
#
# This workflow never exits with a failure code from a single write
# attempt — a rate-limited/quota-exhausted/timed-out attempt just means
# fewer guides written this cycle; the loop tries again next cycle.

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "How many guides to write per cycle"
        required: false
        default: "3"

concurrency:
  group: agent-priority-content
  # false, not true (transfer_news.yml's cancel-in-progress:true pattern was
  # copied too literally 2026-08-02 morning) — found live: GitHub delivers
  # this account's cron ticks erratically, including bursts close together
  # (e.g. one tick 15 minutes after another, nowhere near the nominal 2h
  # spacing). transfer_news.yml can tolerate cancel-in-progress:true because
  # its internal cycle is ~5 minutes; this workflow's write step alone can
  # take up to 25 minutes (timeout 1500 below), so a tick arriving inside
  # that window killed the run before it completed even one cycle — observed
  # directly: a run started 11:06 was killed by a tick at 11:21, never
  # finishing a single write attempt. With cancel-in-progress:false a new
  # tick queues instead of killing the active run; GitHub Actions concurrency
  # semantics already collapse a backlog of queued ticks down to just the
  # latest before it's dequeued, so this doesn't reintroduce a pileup risk,
  # it just stops interrupting real in-flight work.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  write-priority-content:
    name: Rank gaps and write priority guides (self-perpetuating loop)
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('agents/python/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      # Added 2026-08-22 — see breaking_news.yml's identical step for why:
      # llm.py's local-Ollama fallback pulls a ~4.9GB model from scratch on
      # every fresh runner otherwise; this workflow's writers now default to
      # prefer_accuracy=True (Ollama tried before g4f), so it hits Ollama
      # often whenever Groq is exhausted.
      - name: Cache local Ollama fallback model
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ${{ runner.os }}-ollama-llama3.1-8b-v1
          restore-keys: ${{ runner.os }}-ollama-

      - name: Install dependencies
        run: pip install -r agents/python/requirements.txt

      - name: Install fonts for feature-image generation
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core fonts-noto-color-emoji

      # One continuous step, not several chained with `if: always()` — the
      # whole point is an internal loop that outlives any single
      # GitHub-delivered trigger, exactly mirroring transfer_news.yml's
      # proven pattern. Each iteration: pull latest -> rank the queue ->
      # write up to N guides (hard-timeout-wrapped) -> regenerate static
      # pages -> commit/push -> sleep until the next ~2h mark.
      - name: Priority content loop — every ~2h for up to ~5h50m
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          set +e
          git config --local user.email "priority-writer@sifufinds.com"
          git config --local user.name "SifuFinds Priority Content Agent"

          COUNT="${{ github.event.inputs.count || '3' }}"
          CYCLE_SECONDS=$(( 2 * 60 * 60 ))
          # 340 min budget, matching transfer_news.yml's margin under the
          # 350-min job timeout for setup steps + a final iteration's runtime.
          END_TIME=$(( $(date +%s) + 340*60 ))

          while [ "$(date +%s)" -lt "$END_TIME" ]; do
            ITER_START=$(date +%s)
            echo "▶ Priority content cycle — $(date -u '+%Y-%m-%d %H:%M:%S') UTC"

            if ! git pull --rebase origin main; then
              echo "⚠️  Pull rebase failed — resetting to origin/main"
              git rebase --abort 2>/dev/null
              git fetch origin main
              git reset --hard origin/main
            fi

            ( cd agents/python && python agent_content_priority.py )

            # Hard cap on the write step itself: llm.py's Ollama fallback can
            # pull a fresh ~2GB model on this ephemeral runner and, combined
            # with agent_priority_writer.py's own retry-on-quality-gate-
            # failure, has genuinely taken over 20 minutes — confirmed by
            # tonight's first scheduled run getting killed by the old
            # job-level timeout mid-generation. 25 min leaves headroom inside
            # the ~2h cycle without letting one stuck attempt eat the loop.
            ( cd agents/python && timeout 1500 python agent_priority_writer.py --count "$COUNT" )

            # Country trending writer — same hard-cap reasoning as the
            # evergreen writer above (LLM/Ollama-fallback latency risk).
            # Reads the SAME content_priority_queue.json agent_content_
            # priority.py just rebuilt above, so it always sees this cycle's
            # freshest writer-actionable trending items, not a stale queue.
            ( cd agents/python && timeout 1500 python agent_country_trending_writer.py --count "$COUNT" )

            python3 gen_blog_post_pages.py

            # agent_log.json is deliberately gitignored (agents/python/.gitignore)
            # — its durable store is a Supabase mirror (see utils/logger.py),
            # not this repo. A previous version of this workflow tried to
            # force-add it here on the wrong assumption that omitting it was
            # an oversight; `git add` on a gitignored path silently no-ops,
            # so that "fix" never actually worked. Real per-cycle diagnostics
            # (attempted/written counts, per-item failure reasons) now live in
            # priority_writer_state.json / country_trending_writer_state.json's
            # "last_run" key instead, written by each writer itself and
            # committed normally below.
            git add agents/python/content_priority_queue.json agents/python/priority_writer_state.json
            git add agents/python/country_trending_writer_state.json agents/python/covered_stories_state.json
            git add blog/posts.json blog/posts-data.js blog/ assets/og/
            if git diff --cached --quiet; then
              echo "No new priority content this cycle"
            else
              git commit -m "content: priority guides $(date -u '+%Y-%m-%d %H:%M') UTC"

              PUSHED=0
              for _attempt in 1 2 3 4 5; do
                if git push; then
                  echo "✅ Pushed on attempt $_attempt"
                  PUSHED=1
                  break
                fi
                if [ "$_attempt" -eq 5 ]; then
                  echo "❌ Push failed after 5 attempts"
                  break
                fi
                echo "Push rejected (attempt $_attempt/5) — merging and retrying..."
                sleep 5
                git fetch origin main
                git merge --no-edit origin/main || true
                # merge_posts.py is the JSON-aware merge for blog/posts.json — it
                # reads HEAD/FETCH_HEAD via `git show` (bypassing any conflict
                # markers the raw `git merge` above may have left in the working
                # tree) and refuses to write a suspiciously small result. If it
                # fails, do NOT swallow that (2026-08-09 incident: `|| true` here
                # let a failed/skipped merge fall through to `git add -A` and
                # commit whatever the raw text merge left, repeatedly stomping
                # the ~850-post database down to a handful of posts). Instead
                # reset to origin's last-known-good posts.json for this cycle —
                # this cycle's own new post(s) are dropped, but that beats
                # corrupting the shared file; the next scheduled run tries again.
                if ! python3 agents/python/merge_posts.py; then
                  echo "::warning::merge_posts.py failed — resetting blog/posts.json to origin/main instead of committing a possibly-corrupted merge"
                  git checkout origin/main -- blog/posts.json blog/posts-data.js
                fi
                python3 gen_blog_post_pages.py
                git add -A
                git commit -m "content: priority guides $(date -u '+%Y-%m-%d %H:%M') UTC (merged)" --allow-empty
              done
            fi

            NOW=$(date +%s)
            ITER_ELAPSED=$(( NOW - ITER_START ))
            SLEEP_FOR=$(( CYCLE_SECONDS - ITER_ELAPSED ))
            if [ "$SLEEP_FOR" -lt 0 ]; then
              SLEEP_FOR=0
            fi
            if [ "$(( NOW + SLEEP_FOR ))" -ge "$END_TIME" ]; then
              echo "Loop window ending — exiting cleanly so the next queued run takes over with no gap."
              break
            fi
            echo "Sleeping ${SLEEP_FOR}s until the next cycle..."
            sleep "$SLEEP_FOR"
          done

          exit 0
