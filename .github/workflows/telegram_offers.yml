name: Telegram Brand Offers — Best Bonus of the Day, 1x per day

on:
  schedule:
    # 1x per day, morning slot: 07:00 UTC (08:00 WAT / 10:00 EAT).
    # Deliberately down from 6x/day: the daily content strategy is 3 high-quality
    # posts/day (morning bonus + lunch tips + evening tips) rather than posting
    # often enough to overwhelm a still-growing audience. Any further bonus detail
    # worth sharing gets folded into a prediction post instead of a new bonus post.
    # Also posts to Facebook (photo + generated branded image + link to a real
    # bonus-flavoured blog post when one exists) once FACEBOOK_PAGE_ID /
    # FACEBOOK_PAGE_ACCESS_TOKEN secrets are set — skips cleanly until then.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      brand:
        description: "Post a specific brand (leave blank for rotation)"
        required: false
        default: ""
      force:
        description: "Ignore cooldown and post anyway"
        required: false
        default: "false"

concurrency:
  group: telegram-offers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post-offer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('agents/python/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r agents/python/requirements.txt

      - name: Post brand offer to Telegram + Facebook
        working-directory: agents/python
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_CHANNEL_USERNAME: ${{ secrets.TELEGRAM_CHANNEL_USERNAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.brand }}" ]; then ARGS="--brand '${{ github.event.inputs.brand }}'"; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python agent_telegram_offers.py $ARGS

      - name: Commit updated state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "agents@sifufinds.com"
          git config --local user.name "SifuFinds Agent"
          git add agents/python/offers_state.json agents/python/facebook_share_state.json agents/python/agent_log.json || true
          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "offers: posted $(date -u '+%Y-%m-%d %H:%M') UTC"

          # Retry push up to 5 times — handles concurrent bot pushes
          for _attempt in 1 2 3 4 5; do
            if git push; then
              echo "✅ Pushed on attempt $_attempt"
              break
            fi
            if [ "$_attempt" -eq 5 ]; then
              echo "❌ Push failed after 5 attempts"
              exit 1
            fi
            echo "⚠ Push rejected (attempt $_attempt/5) — rebasing in 5s..."
            sleep 5
            git fetch origin main
            git rebase FETCH_HEAD -X theirs || git rebase --abort
          done
