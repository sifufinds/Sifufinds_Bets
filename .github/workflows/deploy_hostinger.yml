name: Deploy to Hostinger — sifufinds.com

# Runs on every push to main that touches web files.
# Bot-only pushes (agents, Python, workflows) are skipped.
#
# Scheduled fallback (added 2026-07-28): confirmed via the GitHub API that
# individual bot commits (e.g. the transfer-news bot's ~5-min push cadence)
# were producing ZERO workflow runs — not "skipped due to paths-ignore", just
# never delivered at all. Same account-wide high-frequency-automation
# behaviour already documented for cron in AGENT-KNOWLEDGE.md, just hitting
# push events this time instead of schedule events. Manual workflow_dispatch
# was the only thing keeping the live site in sync, leaving gaps of up to
# ~1 hour of unpublished blog posts (this is what caused a reported 404 on a
# post that had been committed and pushed to main nearly an hour earlier).
# A cheap ~1-2 min run every 20 minutes closes that gap without depending on
# push delivery at all — re-deploying identical content is a harmless no-op.
on:
  push:
    branches: [main]
    paths-ignore:
      - "agents/**"
      - ".github/workflows/brand_scraper.yml"
      - ".github/workflows/breaking_news.yml"
      - ".github/workflows/seo_sitemap.yml"
      - ".github/workflows/telegram_growth.yml"
      - ".github/workflows/telegram_offers.yml"
      - "*.md"
      - "*.py"
      - "pyproject.toml"
      - "uv.lock"
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false   # never drop an in-flight deploy

permissions:
  actions: read
  contents: read

jobs:
  # Cooldown gate (added 2026-08-07, fixed 2026-08-08): four independent
  # triggers can fire this workflow — push events, the */20min schedule,
  # workflow_watchdog.yml (10 min after any failure), and retry_failed.yml
  # (every ~14 min while the last run is a failure). Found live: from 10:35
  # to 15:52 UTC on 2026-08-07, EVERY one of ~40 consecutive runs failed with
  # HTTP 429 from Hostinger's upload API, some as little as 2 minutes apart.
  #
  # The original version of this gate measured cooldown against the last
  # *run* of this workflow, regardless of whether that run actually attempted
  # an upload. That was a bug: on a repo this active, some trigger lands
  # inside almost every 15-minute window, so a chain of skip-runs kept
  # resetting the clock for each other and a real attempt could be starved
  # indefinitely — even long after Hostinger's rate limit had actually
  # cleared. Found live 2026-08-08: a chain of skip-only runs from 23:03 to
  # 23:43 UTC (each individually "valid" under the old check), then real
  # attempts at 23:58/00:14/01:20 that still hit 429 because the underlying
  # Hostinger-side window is apparently longer than 15 min — leaving newly
  # published blog posts 404ing on the live site for well over an hour.
  #
  # Fixed to measure cooldown against the last run where the deploy job
  # actually executed (conclusion != skipped), not the last run of any kind.
  # Also backs off harder after consecutive real failures (15 -> 30 -> 60
  # min) instead of retrying every single cooldown window during a sustained
  # Hostinger throttle, since hammering a live 429 window only risks
  # extending it. Safe to skip freely either way: every deploy re-uploads the
  # whole site from the current main HEAD (not incremental), so a skipped run
  # never drops content — the next run past cooldown picks up everything.
  check-cooldown:
    name: Check deploy cooldown (avoid Hostinger 429 rate-limit storms)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Check time since last real deploy attempt
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          BASE_COOLDOWN_MIN=15

          # limit 30, not 15: the in-progress run triggering this very check
          # occupies one of the N slots gh run list returns before the
          # status=="completed" filter drops it, so a tight limit can silently
          # undercount how many completed runs are actually visible. Found
          # live 2026-08-08: with limit 15 this cut the scan exactly one run
          # short of a real 4th consecutive failure, so the backoff computed
          # 3 (60min) instead of 4 (120min) right when the longer cooldown was
          # needed most.
          CANDIDATE_IDS=$(gh run list --workflow=deploy_hostinger.yml --repo "$REPO" \
            --limit 30 --json databaseId,status \
            --jq "[.[] | select(.databaseId != ${CURRENT_RUN_ID}) | select(.status == \"completed\")] | .[].databaseId")

          # Walk recent completed runs newest-first, collecting the outcome of
          # every run that actually reached the Hostinger upload step (not
          # just "the deploy job ran") until we have the most recent real
          # attempt's timestamp plus up to 8 real outcomes for backoff.
          #
          # Found live 2026-08-08: a run can fail at an earlier validation
          # step (validate_site.py / compliance_check.py etc.) and never touch
          # the Hostinger API at all — that's a content problem, not a rate
          # limit, and treating it as a "real 429-style failure" wrongly
          # escalated the cooldown to 180min after a compliance-check false
          # positive, blocking deploys for hours with zero Hostinger calls
          # involved. Keying specifically on the upload step's own conclusion
          # (not the job's overall conclusion) tells the two apart: a null
          # conclusion here means the job never got that far.
          LAST_ATTEMPT_CREATED=""
          REAL_CONCLUSIONS=()
          for rid in $CANDIDATE_IDS; do
            UPLOAD_STEP_CONCLUSION=$(gh api "repos/$REPO/actions/runs/$rid/jobs" \
              --jq '.jobs[] | select(.name == "Deploy static site to Hostinger") | .steps[]? | select(.name == "Deploy to Hostinger via MCP (with retry)") | .conclusion' 2>/dev/null)
            if [ -z "$UPLOAD_STEP_CONCLUSION" ] || [ "$UPLOAD_STEP_CONCLUSION" = "skipped" ]; then
              continue
            fi
            if [ -z "$LAST_ATTEMPT_CREATED" ]; then
              LAST_ATTEMPT_CREATED=$(gh run view "$rid" --repo "$REPO" --json createdAt --jq .createdAt)
            fi
            REAL_CONCLUSIONS+=("$UPLOAD_STEP_CONCLUSION")
            if [ "${#REAL_CONCLUSIONS[@]}" -ge 8 ]; then
              break
            fi
          done

          if [ -z "$LAST_ATTEMPT_CREATED" ]; then
            echo "No prior real deploy attempt found in recent history — proceeding with deploy."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Adaptive backoff: 2+ consecutive real failures -> 30min, 3+ -> 60min,
          # 4+ -> 120min, 5+ -> 180min. Found live 2026-08-08: even a 4th
          # consecutive real attempt at 02:28 (68min after the prior failure)
          # and a 5th at 03:46 (79min after that) both still hit 429 — this
          # storm ran from at least 23:58 to past 03:46, well over 4 hours,
          # matching the previously documented 5h17m storm. Escalating further
          # reduces how much this workflow itself contributes to keeping that
          # window open on Hostinger's side.
          COOLDOWN_MIN=$BASE_COOLDOWN_MIN
          CONSECUTIVE_FAILURES=0
          for c in "${REAL_CONCLUSIONS[@]}"; do
            if [ "$c" = "failure" ]; then
              CONSECUTIVE_FAILURES=$((CONSECUTIVE_FAILURES + 1))
            else
              break
            fi
          done
          if [ "$CONSECUTIVE_FAILURES" -ge 5 ]; then
            COOLDOWN_MIN=180
          elif [ "$CONSECUTIVE_FAILURES" -ge 4 ]; then
            COOLDOWN_MIN=120
          elif [ "$CONSECUTIVE_FAILURES" -ge 3 ]; then
            COOLDOWN_MIN=60
          elif [ "$CONSECUTIVE_FAILURES" -ge 2 ]; then
            COOLDOWN_MIN=30
          fi

          LAST_EPOCH=$(date -u -d "$LAST_ATTEMPT_CREATED" +%s)
          NOW_EPOCH=$(date -u +%s)
          ELAPSED_MIN=$(( (NOW_EPOCH - LAST_EPOCH) / 60 ))

          echo "Last real deploy attempt started ${ELAPSED_MIN} min ago ($LAST_ATTEMPT_CREATED). Consecutive real failures: ${CONSECUTIVE_FAILURES}. Cooldown: ${COOLDOWN_MIN}min."

          if [ "$ELAPSED_MIN" -lt "$COOLDOWN_MIN" ]; then
            echo "⏸  Within ${COOLDOWN_MIN}min cooldown since last real attempt — skipping this attempt to avoid a Hostinger 429 rate-limit storm. The */20min schedule or next trigger past cooldown will deploy the current content."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Cooldown elapsed since last real attempt — proceeding with deploy."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy static site to Hostinger
    needs: check-cooldown
    if: needs.check-cooldown.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python (for validators)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies for validators
        # scripts/validate_site.py's CHECK 4 (feature-image tag-safety guard)
        # imports generate_blog_feature_image.py, which needs Pillow — without
        # this, every deploy fails at CHECK 4 with ModuleNotFoundError before
        # a single file reaches Hostinger (found 2026-07-27 after ~6 hours of
        # silently failed deploys).
        run: pip install Pillow

      - name: Validate site — check for 403/404 issues
        run: |
          python3 scripts/validate_site.py
          python3 scripts/audit_titles.py

      - name: Validate site — check nothing blocks Google indexing
        run: |
          python3 scripts/check_indexability.py

      - name: Validate site — SEO audit (blocks on CRITICAL, e.g. duplicate slugs)
        run: |
          python3 scripts/seo_check.py

      - name: Validate site — compliance guard (18+/BeGambleAware/overstated language/sponsored labelling)
        run: |
          python3 scripts/compliance_check.py

      - name: Validate site — country-count guard (catches stale "N African countries" copy)
        run: |
          python3 scripts/check_country_count.py

      - name: Validate deploy token
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: |
          if [ -z "$HOSTINGER_API_TOKEN" ]; then
            echo "❌ HOSTINGER_API_TOKEN secret is not set or is empty"
            exit 1
          fi
          echo "✅ HOSTINGER_API_TOKEN is present (${#HOSTINGER_API_TOKEN} chars)"

      - name: Build deployment archive
        run: |
          ARCHIVE_NAME="sifufinds_$(date +%Y%m%d_%H%M%S).zip"
          ARCHIVE_PATH="$(pwd)/$ARCHIVE_NAME"

          # Build file list — skip missing optional files gracefully
          FILES=()
          for f in index.html analytics.html robots.txt ai.txt llms.txt favicon.ico manifest.json 99f774fee94b3f7a1cd2ade69cdcefb6.txt; do
            [ -f "$f" ] && FILES+=("$f")
          done
          for f in sitemap*.xml; do
            [ -f "$f" ] && FILES+=("$f")
          done
          for f in google*.html ed3656512e7456003ee2a5c4f3139c55.txt; do
            [ -f "$f" ] && FILES+=("$f")
          done
          for f in .htaccess .nojekyll; do
            [ -f "$f" ] && FILES+=("$f")
          done
          # Deploy every top-level content directory by default (exclude-list, not
          # allow-list) so a new public section is never silently dropped from the
          # archive just because nobody remembered to add it here.
          EXCLUDE_DIRS=(agents scripts supabase firecrawl geo-content-writer node_modules ".git" ".github" ".venv" ".vscode" "__pycache__" ".firecrawl" ".claude")
          for d in */; do
            d="${d%/}"
            skip=false
            for ex in "${EXCLUDE_DIRS[@]}"; do
              [ "$d" == "$ex" ] && skip=true && break
            done
            [ "$skip" == false ] && [ -d "$d" ] && FILES+=("$d")
          done

          zip -r "$ARCHIVE_PATH" "${FILES[@]}" \
            -x "*/.git/*" "*/node_modules/*" "*/agents/*"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"
          echo "Archive created: $ARCHIVE_PATH ($(du -sh "$ARCHIVE_PATH" | cut -f1))"

      - name: Deploy to Hostinger via MCP (with retry)
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: |
          INIT='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"gh-actions","version":"1.0"}}}'
          DEPLOY=$(printf '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"hosting_deployStaticWebsite","arguments":{"domain":"sifufinds.com","archivePath":"%s","removeArchive":true}}}' "$ARCHIVE_PATH")

          echo "Archive path: $ARCHIVE_PATH"
          ls -lh "$ARCHIVE_PATH"

          MAX_ATTEMPTS=3
          SUCCESS=false

          for attempt in 1 2 3; do
            echo "━━ Deploy attempt $attempt/$MAX_ATTEMPTS ━━"

            MCP_STDERR_LOG="$(mktemp)"
            RESULT=$(printf '%s\n%s\n' "$INIT" "$DEPLOY" \
              | npx --yes hostinger-api-mcp@latest --stdio 2>"$MCP_STDERR_LOG" \
              | python3 -c "
          import sys, json
          for line in sys.stdin:
              line = line.strip()
              if not line: continue
              try:
                  d = json.loads(line)
                  if d.get('id') == 2:
                      print(json.dumps(d))
              except: pass
          ")

            if [ -s "$MCP_STDERR_LOG" ]; then
              echo "MCP stderr: $(cat "$MCP_STDERR_LOG")"
            fi
            rm -f "$MCP_STDERR_LOG"

            echo "Deploy result: $RESULT"

            IS_RATE_LIMITED=false
            if echo "$RESULT" | grep -q "429"; then
              IS_RATE_LIMITED=true
            fi

            STATUS=$(echo "$RESULT" | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              if 'error' in d:
                  print('ERROR: ' + str(d['error']))
                  sys.exit(1)
              content = d.get('result', {}).get('content', [{}])[0].get('text', '{}')
              data = json.loads(content)
              deploy_status = data.get('deploy', {}).get('status', 'unknown')
              upload_status = data.get('upload', {}).get('status', 'unknown')
              print(f'upload={upload_status} deploy={deploy_status}')
              if deploy_status == 'success' and upload_status == 'success':
                  sys.exit(0)
              sys.exit(1)
          except Exception as e:
              print(f'PARSE_ERROR: {e}')
              sys.exit(1)
          " 2>&1) && SUCCESS=true && echo "✅ $STATUS" && break \
            || echo "⚠ Attempt $attempt failed: $STATUS"

            if [ "$attempt" -lt 3 ]; then
              if [ "$IS_RATE_LIMITED" = "true" ]; then
                # Hostinger's 429 cooldown window has proven longer than a
                # flat 30s in practice (found 2026-08-07: 3 attempts 30s
                # apart all hit 429). Back off harder specifically for rate
                # limits so a single run has a real chance of clearing the
                # window instead of just burning attempts.
                echo "Rate limited (429) — waiting 90s before retry..."
                sleep 90
              else
                echo "Waiting 30s before retry..."
                sleep 30
              fi
            fi
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "❌ Deploy failed after $MAX_ATTEMPTS attempts"
            exit 1
          fi

      - name: Notify Bing/Yandex via IndexNow (best-effort)
        # Only on an actual push (not the */20min schedule, which almost
        # always re-deploys identical content — see the workflow's own
        # comments on why a skipped/redundant deploy is harmless). Reads
        # changed files straight from the push event payload rather than
        # local git history, since checkout above uses fetch-depth:1 (no
        # parent commit available for a git diff). continue-on-error is
        # deliberate: see scripts/submit_indexnow.py's docstring — IndexNow
        # is a best-effort indexing signal, never allowed to fail a deploy
        # that already succeeded against Hostinger.
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
        run: |
          python3 -c "
          import json, os

          commits = json.loads(os.environ['COMMITS_JSON'])
          changed = set()
          for c in commits:
              changed.update(c.get('added', []))
              changed.update(c.get('modified', []))

          def to_url(path):
              if not path.endswith('.html'):
                  return None
              if path == 'index.html':
                  return 'https://sifufinds.com/'
              if path.endswith('/index.html'):
                  return 'https://sifufinds.com/' + path[: -len('index.html')]
              return None

          urls = sorted({u for p in changed if (u := to_url(p))})
          print(f'{len(changed)} changed file(s) in this push -> {len(urls)} URL(s) to notify')
          for u in urls:
              print(f'  {u}')
          with open('/tmp/indexnow_urls.txt', 'w') as f:
              f.write('\n'.join(urls))
          "
          if [ -s /tmp/indexnow_urls.txt ]; then
            python3 scripts/submit_indexnow.py $(cat /tmp/indexnow_urls.txt)
          else
            echo "No changed HTML pages in this push — nothing to submit."
          fi
