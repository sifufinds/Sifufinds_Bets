name: Deploy to Hostinger — sifufinds.com

# Runs on every push to main that touches web files.
# Bot-only pushes (agents, Python, workflows) are skipped.
on:
  push:
    branches: [main]
    paths-ignore:
      - "agents/**"
      - ".github/workflows/brand_scraper.yml"
      - ".github/workflows/breaking_news.yml"
      - ".github/workflows/seo_sitemap.yml"
      - ".github/workflows/telegram_growth.yml"
      - ".github/workflows/telegram_offers.yml"
      - "*.md"
      - "*.py"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static site to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build deployment archive
        run: |
          ARCHIVE="sifufinds_$(date +%Y%m%d_%H%M%S).zip"
          zip -r "$ARCHIVE" \
            index.html \
            .htaccess \
            robots.txt \
            sitemap.xml \
            .nojekyll \
            assets/ \
            about/ \
            betting/ \
            blog/ \
            bonuses/ \
            casino/ \
            countries/ \
            guides/ \
            odds/ \
            tips/ \
            brands/ \
            -x "*/.git/*" "*/node_modules/*" "*/agents/*"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "Archive created: $ARCHIVE ($(du -sh $ARCHIVE | cut -f1))"

      - name: Deploy to Hostinger via MCP
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: |
          INIT='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"gh-actions","version":"1.0"}}}'
          DEPLOY=$(printf '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"hosting_deployStaticWebsite","arguments":{"domain":"sifufinds.com","archivePath":"%s","removeArchive":true}}}' "$ARCHIVE")

          RESULT=$(printf '%s\n%s\n' "$INIT" "$DEPLOY" \
            | npx --yes hostinger-api-mcp@latest --stdio 2>/dev/null \
            | python3 -c "
          import sys, json
          for line in sys.stdin:
              line = line.strip()
              if not line: continue
              try:
                  d = json.loads(line)
                  if d.get('id') == 2:
                      print(json.dumps(d))
              except: pass
          ")

          echo "Deploy result: $RESULT"

          # Fail the step if deploy did not succeed
          echo "$RESULT" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          if 'error' in d:
              print('ERROR:', d['error'])
              sys.exit(1)
          content = d.get('result', {}).get('content', [{}])[0].get('text', '{}')
          data = json.loads(content)
          deploy_status = data.get('deploy', {}).get('status', 'unknown')
          upload_status = data.get('upload', {}).get('status', 'unknown')
          print(f'Upload: {upload_status} | Deploy: {deploy_status}')
          if deploy_status != 'success' or upload_status != 'success':
              sys.exit(1)
          "
