name: Content Backfill — expand thin/no-FAQ blog posts

# Legacy blog posts written before the current content standard (1,000+ words,
# mandatory FAQ, comparison table) never got backfilled. This works through
# that backlog a small batch at a time, permanently, so it never depends on
# a human or an agent session remembering to do it.
#
# Runs once daily shortly after Groq's midnight UTC token quota resets, ahead
# of the other content bots (agent1_content, agent_sports_blog, breaking_news)
# that consume the same shared Groq/Gemini keys throughout the day.
#
# Progress is tracked in agents/python/content_backfill_state.json — committed
# to the repo, so it survives across runs and sessions. A post that fails
# expansion 3 times is left in place (not reprocessed forever) and stays
# visible there for manual follow-up.
#
# This workflow never exits with a failure code — a quota-exhausted run just
# means 0 posts fixed this time; it tries again on the next scheduled run.

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

concurrency:
  group: content-backfill
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    name: Expand next batch of thin/no-FAQ posts
    runs-on: ubuntu-latest
    # 40 min (was 15): confirmed live 2026-08-02 this workflow got cancelled
    # by its own job timeout mid-run for the first time — same root cause as
    # breaking_news.yml's identical fix that day. The 2026-08-01 local Ollama
    # fallback tier in llm.py (see AGENT-KNOWLEDGE.md) adds real wall-clock
    # time (a one-time install+model-pull, then CPU-only inference) that the
    # original 15min budget never accounted for, across BATCH_SIZE=4 posts
    # each needing at least one LLM call.
    timeout-minutes: 40

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('agents/python/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      # Added 2026-08-22 — see breaking_news.yml's identical step for why.
      - name: Cache local Ollama fallback model
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ${{ runner.os }}-ollama-llama3.1-8b-v1
          restore-keys: ${{ runner.os }}-ollama-

      - name: Install dependencies
        run: pip install -r agents/python/requirements.txt

      - name: Run content backfill agent
        id: backfill
        working-directory: agents/python
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          set +e
          # Capped at 30 min (added 2026-08-08, same root cause as
          # breaking_news.yml's identical fix that day, re-triggered by
          # llm.py's Ollama fallback model upgrading 3b->8b the same day
          # this comment was written): without a bound here, a slow/exhausted
          # LLM chain across BATCH_SIZE posts can consume the whole 40-min
          # job timeout, which GitHub reports as "cancelled" — invisible to
          # both workflow_watchdog.yml and retry_failed.yml (both only act
          # on conclusion: "failure") and skips every step after this one
          # (regenerate pages, commit, push, deploy trigger) even for posts
          # that already finished successfully before the kill. A bounded
          # `timeout` here still lets $? get captured normally below and
          # lets the rest of the job run with whatever was completed so far.
          timeout 1800 python agent_content_backfill.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Regenerate static blog pages
        run: python3 gen_blog_post_pages.py --force

      - name: Regenerate sitemap
        run: python3 gen_sitemap.py

      - name: Commit and push expanded posts
        run: |
          git config --local user.email "content-backfill@sifufinds.com"
          git config --local user.name "SifuFinds Content Backfill"
          git add blog/posts.json blog/ sitemap*.xml agents/python/content_backfill_state.json
          if git diff --cached --quiet; then
            echo "No posts expanded this run — nothing to commit"
            exit 0
          fi
          git commit -m "content: backfill thin/no-FAQ posts $(date -u '+%Y-%m-%d') UTC"

          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "✅ Pushed on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "❌ Push failed after 5 attempts"
              exit 1
            fi
            echo "Push rejected (attempt $attempt/5) — merging posts and retrying..."
            sleep 5
            git fetch origin main
            # Plain merge instead of reset+rebase: rebase requires a clean
            # working tree, but the regeneration scripts below always leave
            # one dirty (regenerated files differ from whatever got staged
            # by a reset) — that combination reliably fails with "cannot
            # rebase: you have unstaged changes". A merge has no such
            # requirement; any conflicts it leaves in generated files
            # (blog/*/index.html, sitemap*.xml) are moot because the
            # regeneration step below overwrites them from scratch anyway.
            git merge --no-edit origin/main || true
            python3 agents/python/merge_posts.py
            python3 gen_blog_post_pages.py --force
            python3 gen_sitemap.py
            git add -A
            git commit -m "content: backfill thin/no-FAQ posts $(date -u '+%Y-%m-%d') UTC (merged)" --allow-empty
          done

      - name: Trigger deploy if content changed
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh workflow run deploy_hostinger.yml \
            --repo "${{ github.repository }}" \
            --ref main && echo "✅ Deploy triggered" || echo "⚠️ Deploy trigger failed (will self-correct on next push)"
          exit 0

      - name: Report outcome
        if: always()
        run: |
          CODE="${{ steps.backfill.outputs.exit_code }}"
          if [ -z "$CODE" ] || [ "$CODE" = "0" ]; then
            echo "✅ Content backfill agent ran — see logs above for posts fixed / backlog remaining"
          else
            echo "⚠️ Content backfill agent exit code $CODE — check logs above"
          fi
