name: Traffic Report — GoatCounter daily snapshot

on:
  schedule:
    # Every day at 07:00 UTC
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "30"

concurrency:
  group: traffic-report
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agents/python/requirements.txt

      - name: Install dependencies
        run: pip install -r agents/python/requirements.txt

      - name: Check GoatCounter is configured
        id: gc
        run: |
          if [ -z "${{ secrets.GOATCOUNTER_SITE }}" ] || [ -z "${{ secrets.GOATCOUNTER_TOKEN }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GOATCOUNTER_SITE/GOATCOUNTER_TOKEN secrets are not set — skipping traffic report (not a failure, nothing to retry). See agents/python/traffic_report.md for setup steps."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run traffic report
        if: steps.gc.outputs.configured == 'true'
        working-directory: agents/python
        env:
          GOATCOUNTER_SITE:  ${{ secrets.GOATCOUNTER_SITE }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: |
          python agent_traffic_report.py --days ${{ github.event.inputs.days || '30' }}

      - name: Commit report
        if: steps.gc.outputs.configured == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agents/python/traffic_report.md agents/python/traffic_report.json
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "traffic: daily report $(date -u +%Y-%m-%d)"

      - name: Push report (with retry)
        if: steps.gc.outputs.configured == 'true'
        run: |
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "✅ Pushed on attempt $attempt"
              exit 0
            fi
            [ "$attempt" -eq 5 ] && { echo "❌ Push failed after 5 attempts"; exit 1; }
            echo "⚠ Push rejected (attempt $attempt/5) — rebasing in 5s..."
            sleep 5
            git fetch origin main
            git rebase FETCH_HEAD -X theirs || git rebase --abort
          done
