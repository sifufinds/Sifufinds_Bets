name: Traffic Report — GoatCounter daily snapshot

on:
  schedule:
    # Every day at 07:00 UTC
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "30"

concurrency:
  group: traffic-report
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: agents/python/requirements.txt

      - name: Install dependencies
        run: pip install -r agents/python/requirements.txt

      - name: Run traffic report
        working-directory: agents/python
        env:
          GOATCOUNTER_SITE:  ${{ secrets.GOATCOUNTER_SITE }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: |
          python agent_traffic_report.py --days ${{ github.event.inputs.days || '30' }}

      - name: Commit report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agents/python/traffic_report.md agents/python/traffic_report.json
          git diff --cached --quiet || git commit -m "traffic: daily report $(date -u +%Y-%m-%d)"
          git push
