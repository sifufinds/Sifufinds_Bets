name: Site Monitor — auto-heal sifufinds.com

# Hourly deep check: HTTP status + content validation + hack detection.
# site_doctor.yml runs every 15 min for data freshness.
# This monitor is the broader sweep that triggers a full redeploy on failure.
#
# IMPORTANT: every step uses `set +e` so that network timeouts or temporary
# failures never make the monitor workflow itself turn red. Issues are
# tracked via counters and output variables, not bash exit codes.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: site-monitor
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  health-check:
    name: Check pages + content + auto-redeploy on failure
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check all critical pages (HTTP status)
        id: check
        run: |
          set +eo pipefail
          FAILED=0

          check_page() {
            local url="$1"
            local label="$2"
            local code
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$url" 2>/dev/null) || code="ERR"
            if [ "$code" != "200" ]; then
              echo "FAIL [$code] $label — $url"
              FAILED=$((FAILED+1))
            else
              echo "OK   [200] $label"
            fi
          }

          check_page "https://sifufinds.com/"                          "Home"
          check_page "https://sifufinds.com/about/"                    "About"
          check_page "https://sifufinds.com/tips/"                     "Tips"
          check_page "https://sifufinds.com/casino/"                   "Casino"
          check_page "https://sifufinds.com/odds/"                     "Odds"
          check_page "https://sifufinds.com/blog/"                     "Blog"
          check_page "https://sifufinds.com/countries/"                "Countries"
          check_page "https://sifufinds.com/bonuses/"                  "Bonuses"
          check_page "https://sifufinds.com/bonuses/welcome-bonus/"    "Welcome Bonus"
          check_page "https://sifufinds.com/bonuses/free-bet/"         "Free Bet"
          check_page "https://sifufinds.com/guides/"                   "Guides"
          check_page "https://sifufinds.com/betting/"                  "Betting"
          check_page "https://sifufinds.com/assets/shared.css"         "CSS Asset"
          check_page "https://sifufinds.com/assets/shared.js"          "JS Asset"
          check_page "https://sifufinds.com/data/live.json"            "live.json"

          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Check content integrity
        id: content
        run: |
          set +eo pipefail
          ISSUES=0

          # Fetch assets — || true so a timeout never exits the step
          JS=$(curl -s --max-time 20 "https://sifufinds.com/assets/shared.js" 2>/dev/null) || JS=""
          LIVE=$(curl -s --max-time 15 "https://sifufinds.com/data/live.json" 2>/dev/null) || LIVE=""

          # shared.js must contain the BOOKS data object
          if [ -n "$JS" ] && echo "$JS" | grep -qF "const BOOKS="; then
            echo "OK   shared.js contains BOOKS data"
          elif [ -z "$JS" ]; then
            echo "WARN shared.js fetch failed (network) — skipping"
          else
            echo "FAIL shared.js missing BOOKS data"
            ISSUES=$((ISSUES+1))
          fi

          # live.json must be valid JSON with events array
          if [ -n "$LIVE" ] && echo "$LIVE" | python3 -c "import sys,json; d=json.load(sys.stdin); assert len(d.get('events',[])) > 0" 2>/dev/null; then
            COUNT=$(echo "$LIVE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('count',0))" 2>/dev/null) || COUNT="?"
            echo "OK   live.json has $COUNT events"
          elif [ -z "$LIVE" ]; then
            echo "WARN live.json fetch failed (network) — skipping"
          else
            echo "FAIL live.json missing or empty events"
            ISSUES=$((ISSUES+1))
          fi

          # Football coverage — informational only. Off-peak hours have no football.
          if [ -n "$LIVE" ]; then
            if echo "$LIVE" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          football = [e for e in d.get('events',[]) if e.get('key') in ('world','cafl','afcon','local','epl')]
          assert len(football) > 0
          print(f'{len(football)} football events')
          " 2>/dev/null; then
              echo "OK   live.json contains football events"
            else
              echo "INFO live.json has no football events (normal off-peak)"
            fi
          fi

          # live.json staleness — threshold 90 min to account for quiet periods where
          # live_odds sees no data change and skips committing
          if [ -n "$LIVE" ]; then
            if echo "$LIVE" | python3 -c "
          import sys, json
          from datetime import datetime, timezone
          d = json.load(sys.stdin)
          updated = datetime.fromisoformat(d.get('updated',''))
          age = (datetime.now(timezone.utc) - updated).total_seconds() / 60
          assert age < 90, f'{age:.0f} min old'
          print(f'age: {age:.0f} min')
          " 2>/dev/null; then
              echo "OK   live.json is fresh"
            else
              echo "FAIL live.json is stale (> 90 min old)"
              ISSUES=$((ISSUES+1))
            fi
          fi

          echo "issues=$ISSUES" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Check for hacked/defaced content
        id: hack_check
        run: |
          set +eo pipefail
          HACKED=0

          BODY=$(curl -s --max-time 15 "https://sifufinds.com/" 2>/dev/null | tr '[:upper:]' '[:lower:]') || BODY=""

          if [ -n "$BODY" ]; then
            for term in "hacked by" "defaced" "you have been hacked" "owned by" "r00ted"; do
              if echo "$BODY" | grep -qF "$term"; then
                echo "WARNING: hack indicator found — '$term'"
                HACKED=$((HACKED+1))
              fi
            done
            echo "INFO hack scan complete ($HACKED indicators)"
          else
            echo "WARN home page fetch failed — skipping hack scan"
          fi

          echo "hacked=$HACKED" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Check Google can still crawl the site
        id: indexability
        run: |
          set +eo pipefail
          BLOCKED=0

          ROBOTS=$(curl -s -A "Googlebot" --max-time 15 "https://sifufinds.com/robots.txt" -w "\n__STATUS__%{http_code}" 2>/dev/null) || ROBOTS=""
          ROBOTS_STATUS=$(echo "$ROBOTS" | grep -o '__STATUS__[0-9]*' | grep -o '[0-9]*$')
          ROBOTS_BODY=$(echo "$ROBOTS" | sed 's/__STATUS__[0-9]*$//')

          if [ "$ROBOTS_STATUS" != "200" ]; then
            echo "FAIL robots.txt returned HTTP ${ROBOTS_STATUS:-ERR} to Googlebot"
            BLOCKED=$((BLOCKED+1))
          elif echo "$ROBOTS_BODY" | python3 -c "
          import sys, re
          content = sys.stdin.read()
          current = []
          for line in content.splitlines():
              s = line.strip()
              m = re.match(r'User-agent:\s*(.+)', s, re.IGNORECASE)
              if m:
                  current = [m.group(1).strip()]
                  continue
              m = re.match(r'Disallow:\s*(.*)', s, re.IGNORECASE)
              if m and m.group(1).strip() == '/' and any(a in ('*', 'Googlebot') for a in current):
                  sys.exit(0)
          sys.exit(1)
          " 2>/dev/null; then
            echo "FAIL robots.txt disallows all crawling for '*' or Googlebot"
            BLOCKED=$((BLOCKED+1))
          else
            echo "OK   robots.txt reachable and does not block Googlebot"
          fi

          HOME_HEADERS=$(curl -sI -A "Googlebot" --max-time 15 "https://sifufinds.com/" 2>/dev/null) || HOME_HEADERS=""
          HOME_STATUS=$(echo "$HOME_HEADERS" | head -1 | grep -o '[0-9][0-9][0-9]')

          if [ "$HOME_STATUS" != "200" ]; then
            echo "FAIL homepage returned HTTP ${HOME_STATUS:-ERR} to Googlebot UA"
            BLOCKED=$((BLOCKED+1))
          elif echo "$HOME_HEADERS" | grep -qi "^X-Robots-Tag:.*noindex"; then
            echo "FAIL homepage sends X-Robots-Tag: noindex to Googlebot"
            BLOCKED=$((BLOCKED+1))
          else
            echo "OK   homepage reachable to Googlebot UA, no noindex header"
          fi

          echo "blocked=$BLOCKED" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Trigger site-doctor if data issues found
        if: steps.content.outputs.issues != '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +eo pipefail
          echo "Data issues detected (${{ steps.content.outputs.issues }}) — triggering site_doctor..."
          if gh workflow run site_doctor.yml \
            --repo "${{ github.repository }}" \
            --ref main 2>&1; then
            echo "✅ site_doctor.yml triggered"
          else
            echo "⚠️ Could not trigger site_doctor.yml — it runs on its own 15-min schedule and will self-correct"
          fi
          exit 0

      - name: Trigger indexability auto-heal if Google is blocked
        if: steps.indexability.outputs.blocked != '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +eo pipefail
          echo "🚨 Something is blocking Google from crawling the site (${{ steps.indexability.outputs.blocked }} issue(s)) — triggering auto-heal now"
          if gh workflow run daily_seo_doctor.yml \
            --repo "${{ github.repository }}" \
            --ref main 2>&1; then
            echo "✅ daily_seo_doctor.yml triggered — will auto-fix and redeploy"
          else
            echo "⚠️ Could not trigger daily_seo_doctor.yml — it also runs daily at 06:00 UTC and will self-correct"
          fi
          exit 0

      - name: Auto-redeploy if pages are down or site is hacked
        if: steps.check.outputs.failed != '0' || steps.hack_check.outputs.hacked != '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +eo pipefail
          REASON=""
          [ "${{ steps.check.outputs.failed }}" != "0" ] && REASON="${{ steps.check.outputs.failed }} page(s) down"
          [ "${{ steps.hack_check.outputs.hacked }}" != "0" ] && REASON="$REASON | possible hack detected"

          echo "Auto-healing: $REASON"
          if gh workflow run deploy_hostinger.yml \
            --repo "${{ github.repository }}" \
            --ref main 2>&1; then
            echo "✅ Deploy triggered — site will restore within ~2 minutes"
          else
            echo "⚠️ Could not trigger deploy_hostinger.yml — check token permissions or trigger manually"
          fi
          exit 0

      - name: Summary
        if: always()
        run: |
          set +eo pipefail
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Pages failed : ${{ steps.check.outputs.failed || '0' }}"
          echo "Content issues: ${{ steps.content.outputs.issues || '0' }}"
          echo "Hack indicators: ${{ steps.hack_check.outputs.hacked || '0' }}"
          echo "Google blocked: ${{ steps.indexability.outputs.blocked || '0' }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          exit 0
