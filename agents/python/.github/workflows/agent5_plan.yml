name: Agent 5 — Growth Planner

on:
  schedule:
    # Runs at 02:00 UTC weekly (Sunday 03:00 WAT)
    - cron: "0 2 * * 0"
  workflow_dispatch:

jobs:
  plan-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r agents/python/requirements.txt

      - name: Run Growth Planner
        working-directory: agents/python
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python agent5_plan.py

      - name: Commit planning output
        run: |
          git config --local user.email "agents@sifufinds.com"
          git config --local user.name "SifuFinds Agent"
          git add agents/python/weekly_plan.json agents/python/agent_log.json || true
          git diff --cached --quiet || git commit -m "Agent 5: weekly plan $(date -u '+%Y-%m-%d') UTC"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
